<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Axiom — Engineering Memory Infrastructure</title>
<script defer src="axiom-billing-ui.js"></script>
<meta name="description" content="Axiom analyzes codebases locally in your browser. No login. Knowledge graph, semantic search, impact prediction, and codebase constitution." />
<style>
  :root{
    --bg:#07080b; --panel:#0d1016; --panel-2:#11151d; --line:#1c2230;
    --ink:#e6ebf2; --ink-dim:#8892a6; --ink-mute:#5b6478;
    --accent:#7dd3fc; --accent-2:#a78bfa; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --mono: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans: ui-sans-serif,-apple-system,Segoe UI,Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);padding:6px 10px;border-radius:6px;cursor:pointer;transition:all .15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:linear-gradient(180deg,#1e293b,#0f172a);border-color:#334155;color:var(--ink)}
  button.primary:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(125,211,252,.2)}
  input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 10px;border-radius:6px;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent)}
  .mono{font-family:var(--mono)}
  .dim{color:var(--ink-dim)}
  .mute{color:var(--ink-mute)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--ink-dim)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-mute)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .scroll{overflow:auto}
  .scroll::-webkit-scrollbar{width:8px;height:8px}
  .scroll::-webkit-scrollbar-thumb{background:#1e2634;border-radius:6px}

  /* Layout */
  #app{display:grid;grid-template-columns:220px 1fr;height:100vh}
  aside{background:#08090d;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{width:26px;height:26px;border-radius:6px;background:conic-gradient(from 220deg,#7dd3fc,#a78bfa,#7dd3fc);position:relative}
  .logo::after{content:"";position:absolute;inset:4px;border-radius:4px;background:#08090d}
  .brand b{font-weight:600;letter-spacing:.3px}
  nav{padding:8px;flex:1}
  nav .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink-dim);cursor:pointer;font-size:13px}
  nav .item:hover{background:var(--panel);color:var(--ink)}
  nav .item.active{background:linear-gradient(90deg,rgba(125,211,252,.08),transparent);color:var(--ink);border-left:2px solid var(--accent);padding-left:8px}
  nav .kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .side-foot{padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-mute)}

  main{display:flex;flex-direction:column;min-width:0}
  header.top{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;background:#0a0c11}
  header.top .crumbs{color:var(--ink-dim);font-size:12px}
  header.top .spacer{flex:1}
  .view{flex:1;overflow:auto;position:relative}

  /* Welcome */
  .welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;background:
    radial-gradient(1000px 500px at 50% -100px,rgba(125,211,252,.08),transparent),
    radial-gradient(800px 400px at 50% 120%,rgba(167,139,250,.06),transparent)}
  .welcome h1{font-size:44px;margin:0 0 8px;font-weight:600;letter-spacing:-.5px;background:linear-gradient(180deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .welcome p.tag{color:var(--ink-dim);max-width:560px;margin:0 0 32px;font-size:15px;line-height:1.5}
  .drop{width:min(720px,92%);border:1.5px dashed #24304a;border-radius:12px;padding:36px;background:linear-gradient(180deg,rgba(125,211,252,.03),transparent);transition:all .2s}
  .drop.hover{border-color:var(--accent);background:rgba(125,211,252,.06)}
  .drop h3{margin:0 0 8px;font-weight:500}
  .drop .row{display:flex;gap:8px;margin-top:16px}
  .drop .row input{flex:1}
  .langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:22px;max-width:640px}
  .langs .chip{background:var(--panel)}
  .feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:36px;width:min(900px,92%)}
  .feat{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px;text-align:left}
  .feat .n{font-size:11px;color:var(--ink-mute);font-family:var(--mono)}
  .feat h4{margin:6px 0 4px;font-weight:500}
  .feat p{margin:0;color:var(--ink-dim);font-size:12px;line-height:1.5}

  /* Dashboard */
  .grid{padding:16px;display:grid;gap:14px}
  .g-cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .card h5{margin:0 0 4px;font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.8px;font-weight:500}
  .card .v{font-size:24px;font-weight:600}
  .card .sub{font-size:11px;color:var(--ink-dim);margin-top:2px}
  .card.big{padding:0;overflow:hidden;display:flex;flex-direction:column}
  .card-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card-h h4{margin:0;font-size:13px;font-weight:500}
  .card-b{padding:12px 14px}

  /* Graph */
  #graph{width:100%;height:100%;display:block}
  .graph-wrap{position:relative;height:100%;background:radial-gradient(600px 400px at 30% 30%,rgba(125,211,252,.05),transparent)}
  .graph-legend{position:absolute;bottom:12px;left:12px;background:rgba(13,16,22,.9);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:11px;display:flex;gap:12px}
  .graph-legend span{display:flex;align-items:center;gap:5px}
  .lg-dot{width:8px;height:8px;border-radius:50%}
  .node-info{position:absolute;top:12px;right:12px;width:280px;background:rgba(13,16,22,.95);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px}

  /* Files/list */
  .file-list{font-family:var(--mono);font-size:12px}
  .file-list .fi{padding:6px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer}
  .file-list .fi:hover{background:var(--panel-2)}
  .file-list .fi .path{flex:1;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-list .fi .risk{font-size:11px;padding:1px 6px;border-radius:4px}
  .risk.ok{background:rgba(74,222,128,.15);color:var(--ok)}
  .risk.warn{background:rgba(251,191,36,.15);color:var(--warn)}
  .risk.bad{background:rgba(248,113,113,.15);color:var(--bad)}

  /* Search */
  .search-box{padding:16px;border-bottom:1px solid var(--line)}
  .search-box input{font-size:15px;padding:12px 14px}
  .results{padding:8px 16px}
  .result{padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel);cursor:pointer}
  .result:hover{border-color:var(--accent)}
  .result .p{font-family:var(--mono);font-size:12px;color:var(--accent)}
  .result .snip{color:var(--ink-dim);font-size:12px;margin-top:6px;font-family:var(--mono);white-space:pre-wrap;max-height:80px;overflow:hidden}
  .result .score{float:right;font-size:11px;color:var(--ink-mute)}

  /* Agents */
  .agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px}
  .agent{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px}
  .agent .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .agent .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:16px;background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid var(--line)}
  .agent h4{margin:0;font-weight:500}
  .agent p{color:var(--ink-dim);font-size:12px;margin:0 0 10px;line-height:1.5}
  .agent .status{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-mute)}

  /* Constitution */
  .cons{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .cons .card ul{margin:6px 0 0;padding:0;list-style:none}
  .cons .card li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:12px;display:flex;justify-content:space-between;gap:8px}
  .cons .card li:last-child{border:none}
  .cons .card li .k{color:var(--ink)}
  .cons .card li .v{color:var(--ink-dim)}

  /* Empty */
  .empty{padding:60px 20px;text-align:center;color:var(--ink-dim)}
  .empty h3{color:var(--ink);font-weight:500;margin:0 0 6px}

  /* Progress */
  .progress{position:fixed;top:44px;left:220px;right:0;height:2px;background:transparent;z-index:100}
  .progress .b{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(500px,90%);max-height:80vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-weight:500}
  .modal pre{background:#000;padding:12px;border-radius:6px;font-size:11px;overflow:auto;max-height:300px;color:var(--ink-dim)}

  #planChip{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #repoChip{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:800px){
    #app{grid-template-columns:56px 1fr}
    .brand b,nav .item span.lbl,nav .kbd,.side-foot{display:none}
    #planChip{max-width:150px;font-size:10px}
    #repoChip{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><div class="logo"></div><b>Axiom</b></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div>Standalone · No login</div>
      <div class="mute" style="margin-top:4px">Code analysis local · usage server-metered</div>
    </div>
  </aside>
  <main>
    <header class="top">
      <div class="crumbs" id="crumbs">Welcome</div>
      <div class="spacer"></div>
      <span id="liveBadge" style="display:none;align-items:center;gap:6px;font-size:11px;border:1px solid #ef4444;color:#fca5a5;border-radius:999px;padding:3px 10px;margin-right:8px"><span style="width:7px;height:7px;border-radius:50%;background:#ef4444;display:inline-block;animation:axpulse 1.2s infinite"></span>LIVE</span>
      <button id="btnPalette" title="Command palette (⌘K)" style="margin-right:8px">⌘K</button>
      <button id="btnMCP" title="Connect an external AI agent via MCP" style="margin-right:8px">MCP</button>
      <div class="chip" id="repoChip" style="display:none"><span class="dot ok"></span><span id="repoName">—</span></div>
      <div class="chip" id="planChip" title="Plan & usage — click for billing" style="display:none;cursor:pointer;user-select:none;margin-right:8px"></div>
      <button id="btnReset" style="display:none">Reset</button>

    </header>
    <div class="progress" id="prog" style="display:none"><div class="b" id="progB" style="width:0%"></div></div>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============ Axiom Standalone ============ */
const LS = "axiom.repo.v2";
const state = {
  route: "welcome",
  repo: null, // {name, files:[{path,size,content,lang,module,risk,tokens}], modules:{}, edges:[], health, stats}
  agents: [
    {id:"architect", icon:"⚙", name:"Architect", desc:"Maps service boundaries, module cohesion, and layering violations.", on:false},
    {id:"security",  icon:"🛡", name:"Security",  desc:"Surfaces auth, secrets, input-validation, and cryptography touchpoints.", on:false},
    {id:"debug",     icon:"🐞", name:"Debug",     desc:"Traces error-handling gaps and paths likely to fail under load.", on:false},
    {id:"infra",     icon:"☁", name:"Infra",     desc:"Reads config, Dockerfiles, CI pipelines and deployment topology.", on:false},
    {id:"onboard",   icon:"📘", name:"Onboarding",desc:"Generates a new-engineer tour of the highest-leverage modules.", on:false},
    {id:"quality",   icon:"🧪", name:"Code Quality",desc:"Finds oversized files, branching complexity, dead code and duplication debt.", on:false},
    {id:"tests",     icon:"✅", name:"Test Coverage",desc:"Estimates coverage and ranks untested high-fan-in files by risk.", on:false},
  ],
  progress:0,
  q:""
};

const routes = [
  {id:"welcome",  label:"Welcome",       icon:"◆"},
  {id:"dashboard",label:"Dashboard",     icon:"▤", kbd:"1"},
  {id:"graph",    label:"Knowledge Graph",icon:"◈", kbd:"2"},
  {id:"search",   label:"Semantic Search",icon:"⌕", kbd:"3"},
  {id:"impact",   label:"Impact Predict",icon:"⚡", kbd:"4"},
  {id:"constitution",label:"Constitution",icon:"§", kbd:"5"},
  {id:"agents",   label:"Agents",        icon:"◉", kbd:"6"},
  {id:"review",   label:"PR Review",     icon:"⑂", kbd:"7"},

];

/* ---------- persistence ---------- */
function save(){ try{ if(state.repo) localStorage.setItem(LS, JSON.stringify({repo:stripForSave(state.repo), agents:state.agents})); }catch(e){} }
function stripForSave(r){
  // avoid blowing quota: drop file contents, keep metadata
  return {...r, files:r.files.map(f=>({...f, content: f.content && f.content.length<4000 ? f.content : null}))};
}
function load(){
  try{
    const raw = localStorage.getItem(LS); if(!raw) return;
    const d = JSON.parse(raw);
    if(d.repo) state.repo = d.repo;
    if(d.agents) state.agents = state.agents.map(a=>{ const s=d.agents.find(x=>x.id===a.id); return s?{...a,on:!!s.on}:a; });
  }catch(e){}
}
load();
if(state.repo) state.route="dashboard";

/* ---------- render shell ---------- */
function renderNav(){
  const n = document.getElementById("nav");
  n.innerHTML = routes.map(r=>`
    <div class="item ${state.route===r.id?'active':''}" data-r="${r.id}">
      <span style="width:14px;text-align:center;opacity:.7">${r.icon}</span>
      <span class="lbl">${r.label}</span>
      ${r.kbd?`<span class="kbd">${r.kbd}</span>`:''}
    </div>`).join("");
  n.querySelectorAll(".item").forEach(el=>el.onclick=()=>go(el.dataset.r));
}
function go(r){ state.route=r; render(); }

function renderTop(){
  document.getElementById("crumbs").textContent = routes.find(x=>x.id===state.route)?.label || "";
  const chip = document.getElementById("repoChip");
  const btn = document.getElementById("btnReset");
  if(state.repo){
    chip.style.display=""; btn.style.display="";
    document.getElementById("repoName").textContent = state.repo.name + " · " + state.repo.files.length + " files";
  } else { chip.style.display="none"; btn.style.display="none"; }
  paintPlanChip();
}
function paintPlanChip(){
  const el=document.getElementById("planChip");
  if(!el) return;
  if(!state.repo){ el.style.display="none"; return; }
  try{
    const lic=license(), ui=usageInfo();
    if(lic.expired){
      const prevName=(lic.prev&&PLANS.find(x=>x.id===lic.prev.plan))?PLANS.find(x=>x.id===lic.prev.plan).name:"Previous";
      el.innerHTML=`<span class="dot bad"></span>EXPIRED · <b style="color:var(--bad)">${prevName} — renew</b>`;
      el.style.display="";
      el.onclick=()=>go("pricing");
      return;
    }
    const p=PLANS.find(x=>x.id===lic.plan)||PLANS[0];
    const color=ui.unlimited?"var(--accent)":ui.exceeded?"var(--bad)":ui.pct>=80?"var(--warn)":"var(--ok)";
    const val=ui.unlimited?"unlimited":`${ui.used.toLocaleString()} / ${ui.allowance.toLocaleString()} tok`;
    el.innerHTML=`<span class="dot ${ui.exceeded?"bad":ui.pct>=80?"warn":"ok"}"></span>${p.name} · <b style="color:${color}">${val}</b>`;
    el.style.display="";
    el.onclick=()=>go("pricing");
  }catch(e){ el.style.display="none"; }
}
document.getElementById("btnReset").onclick=()=>{
  if(!confirm("Clear current repository?")) return;
  state.repo=null; localStorage.removeItem(LS); state.route="welcome"; render();
};

/* ---------- MCP integration panel ---------- */
const AXM_MCP_TOOLS = [
  ["axiom_search", "Search the indexed codebase"],
  ["axiom_context", "Retrieve grounded engineering context"],
  ["axiom_dependencies", "Understand dependency relationships"],
  ["axiom_impact", "Determine affected components from a change"],
  ["axiom_memory", "Retrieve engineering memory and ADRs"],
];
const AXM_MCP_ENDPOINT = "http://localhost:8081/mcp";
const AXM_MCP_CMD_STDIO = "bun run mcp:start";
const AXM_MCP_CMD_HTTP = "bun run mcp:http";
function copyMCPCommand(text){
  const done=()=>toast("✅ MCP launch command copied");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); done();
  }
}
function openMCPPanel(){
  const toolsHtml = AXM_MCP_TOOLS.map(([id,desc])=>`
    <div style="display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
      <code class="mono" style="font-size:12px;color:var(--accent)">${id}</code>
      <span class="dim" style="font-size:12px">${desc}</span>
    </div>`).join("");
  openModal("MCP — Connect an external agent", `
    <div class="dim" style="font-size:12px;line-height:1.7;margin-bottom:14px">
      MCP (Model Context Protocol) lets MCP-compatible AI agents — such as <b style="color:var(--ink)">Drevin</b>, Claude, Cursor, and others — use
      Axiom's code-understanding capabilities — search, context, dependencies, impact, and engineering memory —
      against a repository it has indexed.
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px">
      <div style="border:1px solid var(--line);border-radius:8px;padding:10px">
        <div class="mute" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Axiom browser app</div>
        <div style="font-size:12px;color:var(--ok)">● Active</div>
        <div class="dim" style="font-size:11px;margin-top:4px">Analyzes code locally. Not an MCP client.</div>
      </div>
      <div style="border:1px solid var(--line);border-radius:8px;padding:10px">
        <div class="mute" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">MCP server</div>
        <div style="font-size:12px;color:var(--warn)">● Not started</div>
        <div class="dim" style="font-size:11px;margin-top:4px">Run locally to expose Axiom's tools.</div>
      </div>
      <div style="border:1px solid var(--line);border-radius:8px;padding:10px">
        <div class="mute" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">External agent / client</div>
        <div style="font-size:12px;color:var(--accent)">● Connects</div>
        <div class="dim" style="font-size:11px;margin-top:4px">Speaks MCP to the server above.</div>
      </div>
    </div>
    <div style="margin-bottom:8px"><b style="font-size:12px">Available tools</b></div>
    ${toolsHtml}
    <div style="margin-top:14px;margin-bottom:8px"><b style="font-size:12px">Endpoint</b></div>
    <code class="mono" id="mcpEndpoint" style="font-size:12px;background:var(--panel-2);border:1px solid var(--line);padding:8px 10px;border-radius:6px;display:block;word-break:break-all">${AXM_MCP_ENDPOINT}</code>
    <div style="margin-top:14px;margin-bottom:8px"><b style="font-size:12px">Launch command</b></div>
    <div style="display:flex;gap:8px;align-items:center">
      <code class="mono" style="font-size:12px;background:var(--panel-2);border:1px solid var(--line);padding:8px 10px;border-radius:6px;flex:1;overflow:auto;white-space:nowrap">${AXM_MCP_CMD_HTTP}</code>
      <button class="primary" id="mcpCopy">Copy</button>
    </div>
    <div class="dim" style="font-size:11px;margin-top:10px;line-height:1.7">
      Recommended for agents (stdio): <code class="mono" style="color:var(--ink)">${AXM_MCP_CMD_STDIO}</code> ·
      Streamable HTTP: <code class="mono" style="color:var(--ink)">${AXM_MCP_CMD_HTTP}</code> serves the endpoint above.
    </div>
  `);
  document.getElementById("mcpCopy").onclick=()=>copyMCPCommand(AXM_MCP_CMD_HTTP);
}
document.getElementById("btnMCP").onclick=openMCPPanel;

function setProgress(p){
  const el=document.getElementById("prog"), b=document.getElementById("progB");
  if(p==null){ el.style.display="none"; return; }
  el.style.display="block"; b.style.width=Math.round(p*100)+"%";

/* ---------- universal URL router ---------- */
function analyzeUrl(url){
  const u = url.trim();
  if(/\.zip($|\?)/i.test(u)) return cloneZipUrl(u);
  if(/github\.com\//i.test(u)) return cloneGithub(u);
  if(/gitlab\.com\//i.test(u)) return cloneGitLab(u);
  if(/bitbucket\.org\//i.test(u)) return cloneBitbucket(u);
  if(/codeberg\.org\//i.test(u)) return cloneGitea(u, "https://codeberg.org");
  if(/gitea\.com\//i.test(u))    return cloneGitea(u, "https://gitea.com");
  // Bare "owner/repo" → assume GitHub
  if(/^[\w.-]+\/[\w.-]+$/.test(u)) return cloneGithub("https://github.com/"+u);
  alert("Unsupported URL. Paste a GitHub / GitLab / Bitbucket / Codeberg / Gitea repo URL, or a direct .zip link.");
}


async function walkEntry(entry, prefix, out){
  if(entry.isFile){
    await new Promise(res=>entry.file(f=>{ out.push({path:prefix+entry.name, file:f}); res(); }));
  } else if(entry.isDirectory){
    const reader=entry.createReader();
    const reads=await new Promise(res=>reader.readEntries(res));
    for(const c of reads) await walkEntry(c, prefix+entry.name+"/", out);
  }
}

/* ---------- ingest ---------- */
const CODE_EXT = /\.(js|jsx|mjs|cjs|ts|tsx|py|go|rs|java|kt|swift|c|cc|cpp|h|hpp|cs|rb|php|scala|sh|bash|sql|html|css|scss|vue|svelte|yaml|yml|toml|json|md)$/i;
const SKIP = /(^|\/)(node_modules|\.git|dist|build|\.next|\.venv|venv|__pycache__|target|vendor|\.turbo|\.cache|coverage)(\/|$)/;

async function ingestFiles(list, name){
  setProgress(0);
  const kept = list.filter(x=>!SKIP.test(x.path) && CODE_EXT.test(x.path) && x.file.size < 400*1024);
  const files=[]; let i=0;
  for(const it of kept){
    i++; if(i%25===0) setProgress(0.1 + 0.6*i/kept.length);
    try{ const txt = await it.file.text(); files.push(mkFile(it.path, txt)); }catch(e){}
    if(files.length>2000) break;
  }
  finalize(name, files);
}

async function ingestZip(file){
  setProgress(0.05);
  // lightweight zip parser via JSZip CDN
  if(!window.JSZip){
    await loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js");
  }
  const zip = await JSZip.loadAsync(file);
  const entries = Object.values(zip.files).filter(e=>!e.dir && !SKIP.test(e.name) && CODE_EXT.test(e.name));
  const files=[]; let i=0;
  for(const e of entries){
    i++; if(i%25===0) setProgress(0.1+0.6*i/entries.length);
    try{
      const buf = await e.async("uint8array");
      if(buf.length > 400*1024) continue;
      const txt = new TextDecoder().decode(buf);
      files.push(mkFile(e.name, txt));
    }catch(_){}
    if(files.length>2000) break;
  }
  const name = file.name.replace(/\.zip$/i,"");
  finalize(name, files);
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

async function cloneGithub(url){
  const m = url.match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/i);
  if(!m){ alert("Enter a valid GitHub URL"); return; }
  const owner=m[1], repo=m[2].replace(/\.git$/,"");
  setProgress(0.05);
  try{
    const meta = await fetch(`https://api.github.com/repos/${owner}/${repo}`).then(r=>r.json());
    const branch = meta.default_branch || "main";
    setProgress(0.15);
    const tree = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`).then(r=>r.json());
    if(!tree.tree){ throw new Error(tree.message || "Failed to fetch tree"); }
    const blobs = tree.tree.filter(t=>t.type==="blob" && !SKIP.test(t.path) && CODE_EXT.test(t.path) && (t.size||0) < 200*1024).slice(0,400);
    const files=[]; let done=0;
    // fetch via raw.githubusercontent.com to save API quota
    const CONC=8;
    async function worker(q){
      while(q.length){
        const b = q.shift();
        try{
          const txt = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${b.path}`).then(r=>r.text());
          files.push(mkFile(b.path, txt));
        }catch(_){}
        done++; setProgress(0.2 + 0.6*done/blobs.length);
      }
    }
    const q=[...blobs]; await Promise.all(Array.from({length:CONC},()=>worker(q)));
    pushRecent(`${owner}/${repo}`, url);
    finalize(`${owner}/${repo}`, files);
  }catch(e){
    setProgress(null); alert("Clone failed: "+(e.message||e));
  }
}

/* ---------- GitLab (public API) ---------- */
async function cloneGitLab(url){
  const m = url.match(/gitlab\.com\/(.+?)(?:$|[?#]|\/-\/|\.git)/i);
  if(!m){ alert("Enter a valid GitLab repo URL"); return; }
  const projectPath = m[1].replace(/\/$/,"");
  setProgress(0.05);
  try{
    const id = encodeURIComponent(projectPath);
    const meta = await fetch(`https://gitlab.com/api/v4/projects/${id}`).then(r=>r.json());
    if(meta.message) throw new Error(meta.message);
    const branch = meta.default_branch || "main";
    setProgress(0.15);
    // paginated tree
    let all=[], page=1;
    while(true){
      const res = await fetch(`https://gitlab.com/api/v4/projects/${id}/repository/tree?ref=${branch}&recursive=true&per_page=100&page=${page}`);
      const arr = await res.json(); if(!Array.isArray(arr)||!arr.length) break;
      all = all.concat(arr);
      if(arr.length<100 || page>=20) break; page++;
    }
    const blobs = all.filter(t=>t.type==="blob" && !SKIP.test(t.path) && CODE_EXT.test(t.path)).slice(0,400);
    const files=[]; let done=0; const CONC=6;
    async function worker(q){
      while(q.length){
        const b=q.shift();
        try{
          const txt = await fetch(`https://gitlab.com/api/v4/projects/${id}/repository/files/${encodeURIComponent(b.path)}/raw?ref=${branch}`).then(r=>r.text());
          files.push(mkFile(b.path, txt));
        }catch(_){}
        done++; setProgress(0.2 + 0.6*done/blobs.length);
      }
    }
    const q=[...blobs]; await Promise.all(Array.from({length:CONC},()=>worker(q)));
    const name = projectPath;
    pushRecent(name, url);
    finalize(name, files);
  }catch(e){ setProgress(null); alert("GitLab clone failed: "+(e.message||e)); }
}

/* ---------- Bitbucket (public API) ---------- */
async function cloneBitbucket(url){
  const m = url.match(/bitbucket\.org\/([^\/\s]+)\/([^\/\s#?]+)/i);
  if(!m){ alert("Enter a valid Bitbucket repo URL"); return; }
  const owner=m[1], repo=m[2].replace(/\.git$/,"");
  setProgress(0.05);
  try{
    const meta = await fetch(`https://api.bitbucket.org/2.0/repositories/${owner}/${repo}`).then(r=>r.json());
    if(meta.type==="error") throw new Error(meta.error?.message || "Not found");
    const branch = meta.mainbranch?.name || "main";
    setProgress(0.15);
    // recursive src listing
    let all=[], next=`https://api.bitbucket.org/2.0/repositories/${owner}/${repo}/src/${branch}/?max_depth=8&pagelen=100`;
    let pages=0;
    while(next && pages<20){
      const r = await fetch(next); const j = await r.json();
      (j.values||[]).forEach(v=>{ if(v.type==="commit_file") all.push(v.path); });
      next = j.next; pages++;
    }
    const paths = all.filter(p=>!SKIP.test(p) && CODE_EXT.test(p)).slice(0,300);
    const files=[]; let done=0; const CONC=6;
    async function worker(q){
      while(q.length){
        const p=q.shift();
        try{
          const txt = await fetch(`https://api.bitbucket.org/2.0/repositories/${owner}/${repo}/src/${branch}/${p}`).then(r=>r.text());
          files.push(mkFile(p, txt));
        }catch(_){}
        done++; setProgress(0.2 + 0.6*done/paths.length);
      }
    }
    const q=[...paths]; await Promise.all(Array.from({length:CONC},()=>worker(q)));
    const name=`${owner}/${repo}`; pushRecent(name, url); finalize(name, files);
  }catch(e){ setProgress(null); alert("Bitbucket clone failed: "+(e.message||e)); }
}

/* ---------- Gitea / Codeberg (public API) ---------- */
async function cloneGitea(url, base){
  const m = url.match(new RegExp(base.replace(/[.\/]/g,"\\$&")+"\\/([^\\/\\s]+)\\/([^\\/\\s#?]+)","i"));
  if(!m){ alert("Enter a valid repo URL"); return; }
  const owner=m[1], repo=m[2].replace(/\.git$/,"");
  setProgress(0.05);
  try{
    const meta = await fetch(`${base}/api/v1/repos/${owner}/${repo}`).then(r=>r.json());
    const branch = meta.default_branch || "main";
    setProgress(0.15);
    const tree = await fetch(`${base}/api/v1/repos/${owner}/${repo}/git/trees/${branch}?recursive=true&per_page=1000`).then(r=>r.json());
    const blobs = (tree.tree||[]).filter(t=>t.type==="blob" && !SKIP.test(t.path) && CODE_EXT.test(t.path)).slice(0,400);
    const files=[]; let done=0; const CONC=6;
    async function worker(q){
      while(q.length){
        const b=q.shift();
        try{
          const txt = await fetch(`${base}/${owner}/${repo}/raw/branch/${branch}/${b.path}`).then(r=>r.text());
          files.push(mkFile(b.path, txt));
        }catch(_){}
        done++; setProgress(0.2 + 0.6*done/blobs.length);
      }
    }
    const q=[...blobs]; await Promise.all(Array.from({length:CONC},()=>worker(q)));
    const name=`${owner}/${repo}`; pushRecent(name, url); finalize(name, files);
  }catch(e){ setProgress(null); alert("Clone failed: "+(e.message||e)); }
}

/* ---------- Any public .zip URL ---------- */
async function cloneZipUrl(url){
  setProgress(0.05);
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const blob = await res.blob();
    const file = new File([blob], (url.split("/").pop()||"archive.zip"));
    pushRecent(file.name.replace(/\.zip$/i,""), url);
    return ingestZip(file);
  }catch(e){
    setProgress(null);
    alert("ZIP fetch failed: "+(e.message||e)+"\n\nSome hosts block cross-origin downloads (CORS). Download the ZIP and use 'Upload ZIP' instead.");
  }
}

/* ---------- analysis ---------- */
function detectLang(p){
  const e=(p.split(".").pop()||"").toLowerCase();
  return ({js:"JavaScript",jsx:"JavaScript",mjs:"JavaScript",cjs:"JavaScript",ts:"TypeScript",tsx:"TypeScript",py:"Python",go:"Go",rs:"Rust",java:"Java",kt:"Kotlin",swift:"Swift",rb:"Ruby",php:"PHP",cs:"C#",scala:"Scala",c:"C",cc:"C++",cpp:"C++",h:"C",hpp:"C++",sh:"Shell",bash:"Shell",sql:"SQL",html:"HTML",css:"CSS",scss:"SCSS",vue:"Vue",svelte:"Svelte",yml:"YAML",yaml:"YAML",toml:"TOML",json:"JSON",md:"Markdown"})[e]||"Other";
}
function moduleOf(p){
  const parts=p.split("/").filter(x=>x && x!=="src" && x!=="app" && x!=="lib");
  if(parts.length<=1) return "root";
  return parts.slice(0, Math.min(2, parts.length-1)).join("/");
}
function mkFile(path, content){
  const lang = detectLang(path);
  const lines = content ? content.split("\n").length : 0;
  const imports = extractImports(content||"", lang);
  return { path, content, lang, module: moduleOf(path), lines, size: content?content.length:0, imports, tokens: tokenize(content||"") };
}
function extractImports(src, lang){
  const out=new Set();
  const re1 = /(?:from\s+['"]([^'"]+)['"])|(?:require\(\s*['"]([^'"]+)['"]\s*\))|(?:import\s+['"]([^'"]+)['"])/g;
  const re2 = /^\s*import\s+([^\s;]+)/gm; // python/java loose
  let m; while((m=re1.exec(src))) out.add(m[1]||m[2]||m[3]);
  while((m=re2.exec(src))) out.add(m[1]);
  return [...out].filter(x=>x && !x.startsWith("http"));
}
function tokenize(s){
  return (s.toLowerCase().match(/[a-z_][a-z0-9_]{2,}/g)||[]).slice(0,500);
}

function buildGraph(files){
  const byPath={}; files.forEach(f=>byPath[f.path]=f);
  const edges=[];
  for(const f of files){
    for(const imp of f.imports){
      if(!imp.startsWith(".")) continue;
      // resolve relative
      const base = f.path.split("/"); base.pop();
      const parts=(base.join("/")+"/"+imp).split("/");
      const stack=[]; for(const p of parts){ if(p===".."){stack.pop()} else if(p!=="." && p!=="") stack.push(p) }
      const resolved = stack.join("/");
      const cand = [resolved, resolved+".ts", resolved+".js", resolved+".tsx", resolved+"/index.ts", resolved+"/index.js"];
      const hit = cand.find(c=>byPath[c]);
      if(hit) edges.push([f.path, hit]);
    }
  }
  // module aggregation
  const modules={};
  for(const f of files){
    modules[f.module] ||= {name:f.module, files:0, lines:0, langs:{}};
    modules[f.module].files++;
    modules[f.module].lines+=f.lines;
    modules[f.module].langs[f.lang]=(modules[f.module].langs[f.lang]||0)+1;
  }
  // risk: fan-in from other files
  const fanIn={}; edges.forEach(([a,b])=>fanIn[b]=(fanIn[b]||0)+1);
  files.forEach(f=>{
    const fi = fanIn[f.path]||0;
    f.fanIn = fi;
    f.fanOut = f.imports.filter(i=>i.startsWith(".")).length;
    f.risk = Math.min(100, Math.round(fi*15 + (f.lines>400?20:0) + (/auth|payment|billing|crypto|secret/i.test(f.path)?25:0)));
  });
  return {edges, modules, fanIn};
}

function finalize(name, files){
  try{ pushRecent(name, name); }catch(_){}

  setProgress(0.85);
  const {edges, modules, fanIn} = buildGraph(files);
  const health = computeHealth(files, edges);
  state.repo = { name, files, edges, modules, health, createdAt: Date.now() };
  save(); setProgress(1);
  state.route="dashboard"; render();
}
function computeHealth(files, edges){
  const avgLines = files.reduce((s,f)=>s+f.lines,0)/Math.max(1,files.length);
  const highRisk = files.filter(f=>f.risk>=60).length;
  const orphans = files.filter(f=>!edges.find(e=>e[0]===f.path||e[1]===f.path)).length;
  const score = Math.max(0, Math.round(100 - highRisk*2 - (avgLines>200?15:0) - Math.min(20, orphans/Math.max(1,files.length)*40)));
  return {score, avgLines:Math.round(avgLines), highRisk, orphans};
}

/* ---------- GRAPH ---------- */
function viewGraph(root){
  root.innerHTML = `<div class="graph-wrap"><canvas id="graph" style="cursor:grab"></canvas>
    <div style="position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(13,16,22,.9);border:1px solid var(--line);border-radius:8px;padding:8px 10px">
      <input id="gq" placeholder="Filter modules…" style="background:#0a0d13;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 8px;font-size:12px;width:150px"/>
      <label class="dim" style="font-size:11px;display:flex;gap:4px;align-items:center"><input type="checkbox" id="gIso" checked/> isolated</label>
      <label class="dim" style="font-size:11px;display:flex;gap:4px;align-items:center">spread <input type="range" id="gSpread" min="0" max="100" value="45" style="width:80px"/></label>
      <button id="gFit" style="font-size:11px;padding:4px 8px">Fit</button>
    </div>
    <div class="graph-legend" id="legend"></div>
    <div class="node-info" id="nodeInfo" style="display:none"></div>
    <div class="dim" style="position:absolute;bottom:12px;right:12px;font-size:11px;background:rgba(13,16,22,.85);border:1px solid var(--line);border-radius:8px;padding:6px 9px">drag node · drag canvas to pan · scroll to zoom · click node to inspect</div>
  </div>`;
  const wrap=root.querySelector(".graph-wrap"), cv=root.querySelector("#graph");
  const ctx=cv.getContext("2d");
  function resize(){ cv.width=wrap.clientWidth*devicePixelRatio; cv.height=wrap.clientHeight*devicePixelRatio; cv.style.width=wrap.clientWidth+"px"; cv.style.height=wrap.clientHeight+"px"; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  resize(); window.addEventListener("resize",resize);

  const mods = Object.values(state.repo.modules);
  const nodes = mods.map((m,i)=>({id:m.name, size:Math.min(46, 9+Math.sqrt(m.lines)/2.2), files:m.files, lines:m.lines, langs:m.langs, x:0,y:0,vx:0,vy:0,deg:0,comp:0,cx:0,cy:0}));
  const idx={}; nodes.forEach((n,i)=>idx[n.id]=i);
  const links=[]; const seen=new Set(); const adj=nodes.map(()=>[]);
  for(const [a,b] of state.repo.edges){
    const ma=moduleOf(a), mb=moduleOf(b);
    if(ma===mb) continue;
    const k=ma+"|"+mb; if(seen.has(k)) continue; seen.add(k);
    if(idx[ma]!=null && idx[mb]!=null){
      const s=idx[ma], t=idx[mb];
      links.push({s,t,w:1}); nodes[s].deg++; nodes[t].deg++; adj[s].push(t); adj[t].push(s);
    }
  }
  // connected components — clusters live apart, joined only where the web connects them
  const comp=new Array(nodes.length).fill(-1); let nc=0;
  for(let i=0;i<nodes.length;i++){
    if(comp[i]!==-1) continue;
    const q=[i]; comp[i]=nc;
    while(q.length){ const v=q.pop(); for(const u of adj[v]) if(comp[u]===-1){ comp[u]=nc; q.push(u); } }
    nc++;
  }
  nodes.forEach((n,i)=>n.comp=comp[i]);
  const compSize={}; comp.forEach(c=>compSize[c]=(compSize[c]||0)+1);
  const order = Object.keys(compSize).map(Number).sort((a,b)=>compSize[b]-compSize[a]);
  const rank={}; order.forEach((c,i)=>rank[c]=i);
  let spread = 45;
  function layoutCenters(){
    const cols=Math.max(1,Math.ceil(Math.sqrt(order.length)));
    const gap = 260 + spread*7;
    order.forEach((c,i)=>{
      const r=Math.floor(i/cols), col=i%cols;
      const cx=(col-(cols-1)/2)*gap, cy=(r-(Math.ceil(order.length/cols)-1)/2)*gap;
      nodes.forEach(n=>{ if(n.comp===c){ n.cx=cx; n.cy=cy; } });
    });
  }
  layoutCenters();
  nodes.forEach((n,i)=>{ const a=i*2.399; n.x=n.cx+Math.cos(a)*(40+Math.sqrt(compSize[n.comp])*22); n.y=n.cy+Math.sin(a)*(40+Math.sqrt(compSize[n.comp])*22); });

  // view transform (world -> screen)
  const view={k:1,x:wrap.clientWidth/2,y:wrap.clientHeight/2};
  let hover=null, dragging=null, panning=null, off={x:0,y:0}, filter="", showIso=true, selected=null;
  const visible=n=>(showIso||n.deg>0)&&(!filter||n.id.toLowerCase().includes(filter));
  const toWorld=(sx,sy)=>({x:(sx-view.x)/view.k, y:(sy-view.y)/view.k});

  cv.addEventListener("wheel",e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top; const w=toWorld(mx,my); const k=Math.min(3,Math.max(.15, view.k*(e.deltaY<0?1.12:1/1.12))); view.k=k; view.x=mx-w.x*k; view.y=my-w.y*k; },{passive:false});
  cv.addEventListener("mousemove",e=>{
    const r=cv.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top; const w=toWorld(sx,sy);
    if(dragging){ dragging.x=w.x-off.x; dragging.y=w.y-off.y; dragging.vx=dragging.vy=0; return; }
    if(panning){ view.x=sx-panning.x; view.y=sy-panning.y; return; }
    hover=nodes.filter(visible).find(n=>Math.hypot(n.x-w.x,n.y-w.y) < n.size+4) || null;
    cv.style.cursor = hover?"pointer":"grab";
    if(hover) showInfo(hover); else if(selected) showInfo(selected); else hideInfo();
  });
  cv.addEventListener("mousedown",e=>{
    const r=cv.getBoundingClientRect(); const sx=e.clientX-r.left, sy=e.clientY-r.top; const w=toWorld(sx,sy);
    if(hover){ dragging=hover; off.x=w.x-hover.x; off.y=w.y-hover.y; }
    else { panning={x:sx-view.x,y:sy-view.y}; cv.style.cursor="grabbing"; }
  });
  window.addEventListener("mouseup",()=>{ dragging=null; panning=null; });
  cv.addEventListener("click",()=>{ if(hover){ selected=hover; showInfo(hover); } else { selected=null; hideInfo(); } });

  root.querySelector("#gq").oninput=e=>{ filter=e.target.value.trim().toLowerCase(); };
  root.querySelector("#gIso").onchange=e=>{ showIso=e.target.checked; };
  root.querySelector("#gSpread").oninput=e=>{ spread=+e.target.value; layoutCenters(); };
  root.querySelector("#gFit").onclick=()=>fit();
  function fit(){
    const vis=nodes.filter(visible); if(!vis.length) return;
    const xs=vis.map(n=>n.x), ys=vis.map(n=>n.y);
    const minX=Math.min(...xs)-80,maxX=Math.max(...xs)+80,minY=Math.min(...ys)-80,maxY=Math.max(...ys)+80;
    const k=Math.min(wrap.clientWidth/(maxX-minX), wrap.clientHeight/(maxY-minY), 2);
    view.k=Math.max(.12,k); view.x=wrap.clientWidth/2-((minX+maxX)/2)*view.k; view.y=wrap.clientHeight/2-((minY+maxY)/2)*view.k;
  }
  setTimeout(fit, 700);

  function showInfo(n){
    const el=document.getElementById("nodeInfo"); if(!el) return;
    const peers=adj[idx[n.id]].map(i=>nodes[i].id);
    el.style.display="";
    el.innerHTML=`<div style="font-weight:600;margin-bottom:6px">${n.id}</div>
      <div class="dim">${n.files} files · ${n.lines} lines · ${n.deg} connections</div>
      <div class="dim" style="margin-top:4px">cluster #${rank[n.comp]+1} (${compSize[n.comp]} module${compSize[n.comp]>1?"s":""})${n.deg?"":" · isolated"}</div>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">
        ${Object.entries(n.langs).map(([l,c])=>`<span class="chip"><span class="lg-dot" style="background:${langColor(l)}"></span>${l}·${c}</span>`).join("")}
      </div>
      ${peers.length?`<div style="margin-top:8px"><b style="font-size:11px">Connected to</b><div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${peers.slice(0,8).map(p=>`<span class="chip">${p}</span>`).join("")}</div></div>`:""}`;
  }
  function hideInfo(){ const el=document.getElementById("nodeInfo"); if(el) el.style.display="none"; }

  const legend=document.getElementById("legend");
  legend.innerHTML = ["JavaScript","TypeScript","Python","Go","Other"].map(l=>`<span><span class="lg-dot" style="background:${langColor(l)}"></span>${l}</span>`).join("")
    + `<span class="dim">${nc} cluster${nc>1?"s":""} · ${links.length} links</span>`;

  function step(){
    const vis=nodes.filter(visible);
    for(let i=0;i<vis.length;i++){
      const a=vis[i];
      for(let j=i+1;j<vis.length;j++){
        const b=vis[j]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.hypot(dx,dy)||.01;
        const sameComp = a.comp===b.comp;
        const strength = sameComp ? 26000 : 90000;
        const rep = Math.min(9, strength/(d*d)); dx/=d; dy/=d;
        a.vx-=dx*rep*.02; a.vy-=dy*rep*.02;
        b.vx+=dx*rep*.02; b.vy+=dy*rep*.02;
      }
      // pull toward this node's own cluster centre, never a global centre
      a.vx += (a.cx-a.x)*.006; a.vy += (a.cy-a.y)*.006;
    }
    for(const l of links){
      const a=nodes[l.s], b=nodes[l.t];
      if(!visible(a)||!visible(b)) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.01;
      const target=130+ (a.size+b.size), k=(d-target)*.014;
      const ux=dx/d, uy=dy/d;
      a.vx+=ux*k; a.vy+=uy*k; b.vx-=ux*k; b.vy-=uy*k;
    }
    for(const n of vis){ if(n===dragging) continue; n.vx*=.86; n.vy*=.86; n.x+=Math.max(-12,Math.min(12,n.vx)); n.y+=Math.max(-12,Math.min(12,n.vy)); }

    const W=wrap.clientWidth, H=wrap.clientHeight;
    ctx.clearRect(0,0,W,H);
    ctx.save(); ctx.translate(view.x,view.y); ctx.scale(view.k,view.k);
    const focus = hover||selected;
    const near = focus ? new Set([idx[focus.id], ...adj[idx[focus.id]]]) : null;
    for(const l of links){
      const a=nodes[l.s], b=nodes[l.t]; if(!visible(a)||!visible(b)) continue;
      const lit = near && (near.has(l.s)&&near.has(l.t));
      ctx.strokeStyle= lit?"rgba(125,211,252,.75)":(near?"rgba(125,211,252,.06)":"rgba(125,211,252,.18)");
      ctx.lineWidth=(lit?2:1)/view.k;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    for(const n of vis){
      const i=idx[n.id];
      const dim = near && !near.has(i);
      const topLang = Object.entries(n.langs).sort((a,b)=>b[1]-a[1])[0]?.[0]||"Other";
      const c = langColor(topLang);
      ctx.globalAlpha = dim?.25:1;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.size,0,Math.PI*2);
      const g=ctx.createRadialGradient(n.x,n.y,1,n.x,n.y,n.size);
      g.addColorStop(0,c); g.addColorStop(1,"#0f1420");
      ctx.fillStyle=g; ctx.fill();
      ctx.strokeStyle= n===focus?"#7dd3fc":(n.deg===0?"rgba(255,255,255,.10)":"rgba(255,255,255,.18)");
      ctx.setLineDash(n.deg===0?[4,4]:[]); ctx.lineWidth=(n===focus?2.5:1)/view.k; ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#e6ebf2"; ctx.font=(11/view.k<7?7*view.k:11)+"px "+getComputedStyle(document.body).fontFamily;
      ctx.textAlign="center"; ctx.fillText(n.id, n.x, n.y+n.size+12);
      ctx.globalAlpha=1;
    }
    ctx.restore();
    if(state.route==="graph") requestAnimationFrame(step);
  }
  step();
}

/* ---------- SEARCH ---------- */
function viewSearch(root){
  root.innerHTML = `
    <div class="search-box">
      <input id="q" placeholder="Search by meaning — e.g. 'authentication logic', 'payment validation', 'database queries'" value="${state.q||''}"/>
      <div class="dim" style="margin-top:6px;font-size:11px">Semantic ranking uses token overlap + path & module signals. Runs entirely in your browser.</div>
    </div>
    <div class="results" id="res"></div>`;
  const q=root.querySelector("#q"), res=root.querySelector("#res");
  const doSearch=()=>{
    const v=q.value.trim(); state.q=v;
    if(!v){ res.innerHTML=`<div class="empty">Type a query to search across ${state.repo.files.length} files.</div>`; return; }
    const terms=v.toLowerCase().match(/[a-z_][a-z0-9_]{2,}/g)||[];
    const scored=state.repo.files.map(f=>{
      let s=0;
      for(const t of terms){
        if(f.path.toLowerCase().includes(t)) s+=8;
        if(f.module.toLowerCase().includes(t)) s+=4;
        const tc = f.tokens.filter(x=>x===t).length; s+=tc*1;
        if((f.content||"").toLowerCase().includes(t)) s+=2;
      }
      return {f,s};
    }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,30);
    if(!scored.length){ res.innerHTML=`<div class="empty">No matches.</div>`; return; }
    res.innerHTML = scored.map(({f,s})=>{
      const snip = snippet(f.content||"", terms);
      return `<div class="result" data-p="${f.path}">
        <span class="score">score ${s}</span>
        <div class="p">${f.path}</div>
        <div class="dim" style="font-size:11px;margin-top:2px">${f.lang} · ${f.lines} lines · risk ${f.risk}</div>
        ${snip?`<div class="snip">${snip}</div>`:''}
      </div>`;
    }).join("");
    res.querySelectorAll(".result").forEach(el=>el.onclick=()=>openFile(el.dataset.p));
  };
  q.addEventListener("input",doSearch);
  doSearch();
  setTimeout(()=>q.focus(),50);
}
function snippet(src, terms){
  if(!src) return "";
  const lc = src.toLowerCase();
  for(const t of terms){
    const i=lc.indexOf(t); if(i>=0){
      const start=Math.max(0,i-60), end=Math.min(src.length,i+140);
      return escapeHtml(src.slice(start,end)).replace(new RegExp(t,"gi"),m=>`<mark style="background:rgba(125,211,252,.25);color:#fff;padding:0 2px">${m}</mark>`);
    }
  }
  return escapeHtml(src.slice(0,180));
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

/* ---------- Fix Effort & Ownership helpers ---------- */
function estimateEffort(fileCount, depCount){
  if(fileCount<=1 && depCount===0) return {level:"Low", label:"Quick Fix", hours:"<2h", color:"ok", emoji:"🟢"};
  if(fileCount<=5 && depCount<=2)  return {level:"Medium", label:"Moderate", hours:"2–8h", color:"warn", emoji:"🟡"};
  return {level:"High", label:"Significant", hours:"8h+", color:"bad", emoji:"🔴"};
}
function suggestOwner(path){
  const p=(path||"").toLowerCase();
  const rules=[
    [/(^|\/)(auth|login)(\/|$)/, "@auth-team"],
    [/(^|\/)security(\/|$)/,     "@security-team"],
    [/(^|\/)(api|routes)(\/|$)/, "@api-team"],
    [/(^|\/)(models|database|db)(\/|$)/, "@data-team"],
    [/(^|\/)(ui|frontend|components|pages|views)(\/|$)/, "@frontend-team"],
    [/(^|\/)(infra|deploy|devops|k8s|terraform)(\/|$)/, "@infra-team"],
  ];
  for(const [re,team] of rules) if(re.test(p)) return team;
  return "@lead-engineer";
}
function toast(msg){
  let t=document.getElementById("axToast");
  if(!t){
    t=document.createElement("div"); t.id="axToast";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)";
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity="1";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity="0",2200);
}
function copyText(text){
  const done=()=>toast("✅ Ticket draft copied to clipboard");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); done();
  }
}
function buildTicket({riskLabel, riskLevel, file, effort, files, services, recommendation, owner, kind}){
  return `[AXIOM] [${riskLabel}] Fix: ${file}

Description:
Axiom detected ${kind} in ${file}.

Risk Level: ${riskLevel}
Effort: ${effort.level} · ${effort.hours}
Files Affected: ${(files&&files.length?files:[file]).join(", ")}
Services Affected: ${(services&&services.length?services:["n/a"]).join(", ")}

Recommendation:
${recommendation}

Suggested Reviewer: ${owner}

---
Generated by Axiom Engineering Memory Infrastructure`;
}
window.__axTickets = {};
window.__axCopyTicket = function(id){ const t=window.__axTickets[id]; if(t) copyText(t); };

/* ---------- IMPACT ---------- */
function viewImpact(root){
  root.innerHTML=`
    <div class="search-box">
      <input id="qi" placeholder="Pick a file to predict impact of changing it…"/>
    </div>
    <div id="ires" class="results"></div>`;
  const inp=root.querySelector("#qi"), out=root.querySelector("#ires");
  const files=state.repo.files;
  function list(prefix=""){
    const f=files.filter(x=>x.path.toLowerCase().includes(prefix.toLowerCase())).slice(0,20);
    out.innerHTML = f.map(x=>`<div class="result" data-p="${x.path}">
      <div class="p">${x.path}</div>
      <div class="dim" style="font-size:11px;margin-top:2px">${x.lang} · fan-in ${x.fanIn||0} · risk ${x.risk}</div>
    </div>`).join("") || `<div class="empty">No files match.</div>`;
    out.querySelectorAll(".result").forEach(el=>el.onclick=()=>showImpact(el.dataset.p));
  }
  inp.addEventListener("input",()=>list(inp.value));
  list();

  function showImpact(path){
    const target = files.find(f=>f.path===path); if(!target) return;
    // walk reverse edges (BFS) to find dependents
    const rev = {}; state.repo.edges.forEach(([a,b])=>{ (rev[b]||=[]).push(a); });
    const seen=new Set([path]); const layers=[[path]];
    for(let d=0;d<3;d++){
      const next=new Set();
      for(const p of layers[d]) for(const dep of (rev[p]||[])) if(!seen.has(dep)){ seen.add(dep); next.add(dep); }
      if(!next.size) break;
      layers.push([...next]);
    }
    const affected=[...seen].filter(p=>p!==path);
    const risk = Math.min(100, target.risk + affected.length*4 + (target.fanIn||0)*3);
    const rClass = risk>=70?"bad":risk>=40?"warn":"ok";
    const riskLabel = risk>=70?"Critical":risk>=40?"Semi-Risk":"Low";
    const totalFiles = affected.length+1;
    const directDeps = (rev[path]||[]).length;
    const effort = estimateEffort(totalFiles, directDeps);
    const owner = suggestOwner(path);
    const services = [...new Set([path, ...affected].map(p=>p.split("/")[0]))].slice(0,6);
    const filesList = [path, ...affected].slice(0,20);
    const recommendation = risk>=70
      ? "Require review from the owning team and Security. Consider a staged rollout with feature flag and monitoring on downstream services."
      : risk>=40
      ? "Coordinate with the owning team; add tests covering dependents before merge."
      : "Low-impact change. Standard review is sufficient.";
    const ticket = buildTicket({riskLabel, riskLevel:riskLabel, file:path, effort, files:filesList, services, recommendation, owner, kind:"a high-impact change"});
    const ticketId = "tk_impact_"+Math.random().toString(36).slice(2,8);
    window.__axTickets[ticketId] = ticket;
    out.innerHTML=`
      <div class="result" style="border-color:var(--accent)">
        <div class="p">${path}</div>
        <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap">
          <div><div class="dim" style="font-size:11px">RISK SCORE</div><div style="font-size:28px;font-weight:600" class="risk ${rClass}" style="padding:2px 10px;display:inline-block">${risk}</div></div>
          <div><div class="dim" style="font-size:11px">DIRECT DEPENDENTS</div><div style="font-size:22px">${directDeps}</div></div>
          <div><div class="dim" style="font-size:11px">TOTAL AFFECTED</div><div style="font-size:22px">${affected.length}</div></div>
          <div><div class="dim" style="font-size:11px">BLAST RADIUS</div><div style="font-size:22px">${layers.length-1} hops</div></div>
        </div>
        ${ownershipBlock(effort, owner, ticketId, path)}
        <div style="margin-top:12px;font-size:12px;color:var(--ink-dim)">🛡 <b>Recommendation:</b> ${recommendation}</div>
      </div>

      ${layers.slice(1).map((l,i)=>`
        <div class="card big" style="margin-top:10px">
          <div class="card-h"><h4>Layer ${i+1} · ${l.length} files</h4></div>
          <div class="card-b" style="padding:0"><div class="file-list">
            ${l.slice(0,30).map(p=>`<div class="fi" data-p="${p}"><span class="path">${p}</span></div>`).join("")}
          </div></div>
        </div>`).join("")}
      <button style="margin-top:10px" id="back">← Pick another file</button>`;
    out.querySelectorAll(".fi[data-p]").forEach(el=>el.onclick=()=>showImpact(el.dataset.p));
    out.querySelector("#back").onclick=()=>list();
  }
}

      <ul>${dark.length?dark.map(f=>`<li><span class="k">${f.path}</span></li>`).join(""):`<li><span class="v">None detected.</span></li>`}</ul>

function agentSeverity(score){ return score>=70?"Critical":score>=40?"Warning":"Info"; }
function sevClass(s){ return s==="Critical"?"bad":s==="Warning"?"warn":"ok"; }

/* Each agent returns { headline, metrics:[[k,v]], findings:[{title,file,sev,why,fix,files}] } */
function runAgent(a){
  const r=state.repo, files=r.files;
  const rev={}; r.edges.forEach(([x,y])=>{(rev[y]||=[]).push(x)});
  const body=f=>(f.content||"");
  const out={headline:"", metrics:[], findings:[]};

  if(a.id==="architect"){
    const mods=Object.values(r.modules).sort((x,y)=>y.lines-x.lines);
    const cross=r.edges.filter(([x,y])=>moduleOf(x)!==moduleOf(y));
    const pairs={}; cross.forEach(([x,y])=>{const k=[moduleOf(x),moduleOf(y)].join(" ↔ ");pairs[k]=(pairs[k]||0)+1;});
    // cycles between modules
    const mEdge=new Set(cross.map(([x,y])=>moduleOf(x)+">"+moduleOf(y)));
    const cycles=[...mEdge].filter(e=>{const [x,y]=e.split(">");return x<y && mEdge.has(y+">"+x);});
    out.metrics=[["Modules",mods.length],["Cross-module edges",cross.length],["Circular module pairs",cycles.length],["Largest module",mods[0]?.name||"n/a"]];
    out.headline=`${mods.length} modules, ${cycles.length} circular dependencies`;
    cycles.slice(0,8).forEach(c=>{const [x,y]=c.split(">");out.findings.push({title:`Circular dependency: ${x} ↔ ${y}`,file:x,sev:"Critical",why:"Two modules import each other, so neither can be changed, tested, or extracted independently.",fix:`Extract the shared contract into a third module, or invert one direction with an interface/event.`,files:[x,y]});});
    Object.entries(pairs).sort((p,q)=>q[1]-p[1]).slice(0,5).forEach(([k,v])=>{ if(v>=6) out.findings.push({title:`High coupling: ${k} (${v} edges)`,file:k.split(" ↔ ")[0],sev:v>=12?"Critical":"Warning",why:`${v} distinct imports cross this boundary — the split is nominal, not real.`,fix:"Consolidate the crossing calls behind one façade module, or merge the two modules if the boundary earns nothing.",files:[k]}); });
    mods.slice(0,3).forEach(m=>{ if(m.files>=40) out.findings.push({title:`God module: ${m.name}`,file:m.name,sev:"Warning",why:`${m.files} files / ${m.lines} lines in one module — ownership and review get diffuse.`,fix:"Split along the strongest internal cluster seen in the Knowledge Graph.",files:[m.name]}); });
  }

  else if(a.id==="security"){
    const pats=[
      [/(api[_-]?key|secret|password|token)\s*[:=]\s*['"][A-Za-z0-9_\-\/+]{12,}['"]/i,"Hardcoded credential","Critical","A literal secret is embedded in source. Anyone with repo access — or the published bundle — has it.","Move it to an environment variable / secret manager and rotate the exposed value."],
      [/\beval\s*\(|new Function\s*\(/,"Dynamic code execution","Critical","eval / new Function executes strings as code; any tainted input becomes remote code execution.","Replace with an explicit parser, lookup table, or JSON.parse."],
      [/innerHTML\s*=|dangerouslySetInnerHTML/,"Raw HTML injection","Warning","Unescaped HTML assignment is the standard XSS sink.","Escape the value, or render text nodes / sanitize with DOMPurify."],
      [/(select|insert|update|delete)\s+.*(\+\s*\w+|\$\{)/i,"String-built SQL","Critical","Query text is concatenated with variables — classic SQL injection.","Use parameterized queries / prepared statements."],
      [/child_process|exec\s*\(|subprocess\.(call|Popen)/,"Shell execution","Warning","Spawning shells from app code widens the blast radius of any injection.","Avoid shells; if required, pass argument arrays and validate strictly."],
      [/verify\s*:\s*false|rejectUnauthorized\s*:\s*false|InsecureSkipVerify/i,"TLS verification disabled","Critical","Certificate checks are turned off, enabling trivial MITM.","Remove the flag and trust a proper CA bundle."],
      [/md5|sha1\b/i,"Weak hash","Warning","MD5/SHA-1 are broken for integrity and password use.","Use SHA-256+ for integrity and bcrypt/argon2 for passwords."],
      [/cors\(\s*\)|Access-Control-Allow-Origin\s*[:=]\s*['"]\*/i,"Permissive CORS","Warning","Wildcard CORS lets any origin call authenticated endpoints.","Whitelist explicit origins."],
    ];
    let scanned=0;
    for(const f of files){
      const c=body(f); if(!c) continue; scanned++;
      for(const [re,title,sev,why,fix] of pats){
        if(re.test(c)) out.findings.push({title,file:f.path,sev,why,fix,files:[f.path],deps:(rev[f.path]||[]).length});
      }
    }
    const authFiles=files.filter(f=>/auth|login|session|permission/i.test(f.path)).length;
    out.metrics=[["Files scanned",scanned],["Findings",out.findings.length],["Critical",out.findings.filter(f=>f.sev==="Critical").length],["Auth-related files",authFiles]];
    out.headline=out.findings.length?`${out.findings.length} security issues`:"no known vulnerable patterns";
  }

  else if(a.id==="debug"){
    for(const f of files){
      const c=body(f); if(!c) continue;
      const empties=(c.match(/catch\s*\([^)]*\)\s*\{\s*\}/g)||[]).length;
      if(empties) out.findings.push({title:`${empties} swallowed exception${empties>1?"s":""}`,file:f.path,sev:"Critical",why:"Empty catch blocks erase failures — incidents surface later, far from the cause.",fix:"Log with context and re-throw, or handle explicitly with a documented reason.",files:[f.path]});
      const awaits=(c.match(/await\s+/g)||[]).length, trys=(c.match(/try\s*\{/g)||[]).length;
      if(awaits>=6 && trys===0) out.findings.push({title:`Unguarded async path (${awaits} awaits, no try)`,file:f.path,sev:"Warning",why:"Every await here can reject and take the request down unhandled.",fix:"Wrap the I/O boundary in try/catch and return a typed error.",files:[f.path]});
      const todos=(c.match(/TODO|FIXME|HACK|XXX/g)||[]).length;
      if(todos>=3) out.findings.push({title:`${todos} unresolved TODO/FIXME markers`,file:f.path,sev:"Info",why:"Concentrated markers usually mark a known-shaky area.",fix:"Triage into tickets or delete the stale ones.",files:[f.path]});
      if(/console\.log|print\(/.test(c) && /password|token|secret/i.test(c)) out.findings.push({title:"Possible secret logging",file:f.path,sev:"Critical",why:"Log statements sit next to credential handling — secrets can leak to log sinks.",fix:"Redact fields before logging.",files:[f.path]});
    }
    out.metrics=[["Files analysed",files.length],["Swallowed exceptions",out.findings.filter(f=>/swallowed/.test(f.title)).length],["Findings",out.findings.length]];
    out.headline=out.findings.length?`${out.findings.length} reliability risks`:"error handling looks consistent";
  }

  else if(a.id==="infra"){
    const infra=files.filter(f=>/dockerfile|docker-compose|\.ya?ml$|\.tf$|workflows\/|k8s|helm|nginx|caddy|Procfile|\.env/i.test(f.path));
    const has=re=>infra.some(f=>re.test(f.path));
    for(const f of infra){
      const c=body(f);
      if(/^FROM .*:latest/mi.test(c)) out.findings.push({title:"Unpinned base image (:latest)",file:f.path,sev:"Warning",why:"Builds are not reproducible; a silent upstream change can break or compromise the image.",fix:"Pin to a digest or explicit version tag.",files:[f.path]});
      if(/USER\s+root/i.test(c)||(/^FROM /mi.test(c)&&!/USER\s+/i.test(c))) out.findings.push({title:"Container runs as root",file:f.path,sev:"Warning",why:"A container escape inherits root privileges.",fix:"Add a non-root USER and adjust file ownership.",files:[f.path]});
      if(/(password|secret|token|key)\s*[:=]\s*\S{8,}/i.test(c)&&!/\$\{|\$\(|secretKeyRef/.test(c)) out.findings.push({title:"Credential in config file",file:f.path,sev:"Critical",why:"Deployment config holds a plaintext secret.",fix:"Reference a secret store / CI variable instead.",files:[f.path]});
    }
    if(!has(/workflows\/|\.gitlab-ci|circleci|jenkins/i)) out.findings.push({title:"No CI pipeline detected",file:"(repo root)",sev:"Warning",why:"Nothing enforces tests or lint before merge.",fix:"Add a CI workflow running install → lint → test on pull requests.",files:["(repo root)"]});
    if(!has(/dockerfile|docker-compose/i)) out.findings.push({title:"No container definition",file:"(repo root)",sev:"Info",why:"Environments are reproduced by hand, so 'works on my machine' drift is likely.",fix:"Add a Dockerfile pinned to the runtime version you deploy.",files:["(repo root)"]});
    out.metrics=[["Infra artifacts",infra.length],["CI configured",has(/workflows\/|\.gitlab-ci|circleci|jenkins/i)?"yes":"no"],["Containerized",has(/dockerfile/i)?"yes":"no"],["Findings",out.findings.length]];
    out.headline=`${infra.length} infra artifacts, ${out.findings.length} gaps`;
  }

  else if(a.id==="onboard"){
    const seeds=[...files].sort((x,y)=>(y.fanIn||0)-(x.fanIn||0)).slice(0,8);
    const entry=files.find(f=>/(^|\/)(main|index|app|server|cli)\.[a-z]+$/i.test(f.path));
    const docs=files.filter(f=>/readme|docs?\//i.test(f.path)).length;
    out.metrics=[["Files",files.length],["Modules",Object.keys(r.modules).length],["Docs files",docs],["Entry point",entry?entry.path:"not found"]];
    out.headline=`${seeds.length}-stop tour of the highest-leverage code`;
    seeds.forEach((f,i)=>out.findings.push({title:`Stop ${i+1}: ${f.path.split("/").pop()}`,file:f.path,sev:"Info",why:`fan-in ${f.fanIn||0} · ${f.lines} lines · module ${f.module}. ${(f.fanIn||0)>3?"Many files depend on this — read it before changing anything.":"Core logic worth reading early."}`,fix:"Read top-to-bottom, then trace one call outward in the Knowledge Graph.",files:[f.path]}));
    if(!docs) out.findings.push({title:"No README or docs directory",file:"(repo root)",sev:"Warning",why:"New engineers have no written entry point; the knowledge lives in people's heads.",fix:"Write a README covering setup, architecture in one diagram, and how to run tests.",files:["(repo root)"]});
  }

  else if(a.id==="quality"){
    for(const f of files){
      const c=body(f); if(!c) continue;
      const cx=(c.match(/\b(if|for|while|case|catch|&&|\|\||\?)\b|\?\./g)||[]).length;
      if(f.lines>400) out.findings.push({title:`Oversized file (${f.lines} lines)`,file:f.path,sev:f.lines>900?"Critical":"Warning",why:"Long files hide multiple responsibilities and make review shallow.",fix:"Split by responsibility; start with the largest exported unit.",files:[f.path]});
      if(cx>60) out.findings.push({title:`High branching complexity (~${cx} decision points)`,file:f.path,sev:cx>140?"Critical":"Warning",why:"Dense branching means untestable paths and regression risk on every edit.",fix:"Extract guard clauses and pure helpers; add tests for the top three branches first.",files:[f.path]});
      if(/(^|\n)\s*(function|const)\s+\w+/.test(c) && (f.fanIn||0)===0 && (f.fanOut||0)===0 && !/index|main|test|spec|config/i.test(f.path))
        out.findings.push({title:"Orphaned file (no imports in or out)",file:f.path,sev:"Info",why:"Nothing references it — likely dead code or an undocumented entry point.",fix:"Delete it, or document why it stands alone.",files:[f.path]});
    }
    const dup={};
    files.forEach(f=>{const k=f.path.split("/").pop().toLowerCase();(dup[k]||=[]).push(f.path);});
    Object.entries(dup).filter(([k,v])=>v.length>=3&&!/index|readme|__init__|types/.test(k)).slice(0,5)
      .forEach(([k,v])=>out.findings.push({title:`${v.length} files named ${k}`,file:v[0],sev:"Info",why:"Repeated filenames often signal copy-paste structure and ambiguous imports.",fix:"Rename by domain, or extract the shared behaviour.",files:v.slice(0,6)}));
    out.metrics=[["Files",files.length],["Oversized",out.findings.filter(f=>/Oversized/.test(f.title)).length],["Complex",out.findings.filter(f=>/complexity/.test(f.title)).length],["Findings",out.findings.length]];
    out.headline=out.findings.length?`${out.findings.length} maintainability debts`:"no significant debt detected";
  }

  else if(a.id==="tests"){
    const isTest=f=>/(^|\/)(tests?|__tests__|spec)\//i.test(f.path)||/\.(test|spec)\.[a-z]+$/i.test(f.path)||/_test\.[a-z]+$/i.test(f.path);
    const tests=files.filter(isTest), src=files.filter(f=>!isTest(f));
    const ratio=src.length?Math.round(tests.length/src.length*100):0;
    const covered=new Set();
    tests.forEach(t=>{const base=t.path.split("/").pop().replace(/\.(test|spec)\./,".").replace(/_test\./,".");covered.add(base.toLowerCase());});
    const risky=src.filter(f=>!covered.has(f.path.split("/").pop().toLowerCase()))
      .sort((x,y)=>((y.fanIn||0)*10+y.risk)-((x.fanIn||0)*10+x.risk)).slice(0,12);
    out.metrics=[["Test files",tests.length],["Source files",src.length],["Test-to-source ratio",ratio+"%"],["Untested high-risk",risky.length]];
    out.headline=tests.length?`${ratio}% test-to-source ratio`:"no tests found";
    if(!tests.length) out.findings.push({title:"No test suite detected",file:"(repo root)",sev:"Critical",why:"Every change ships unverified; regressions are found by users.",fix:"Add a runner and cover the three highest fan-in files first.",files:["(repo root)"]});
    risky.forEach(f=>out.findings.push({title:`Untested: ${f.path.split("/").pop()}`,file:f.path,sev:(f.fanIn||0)>=4||f.risk>=70?"Critical":"Warning",why:`fan-in ${f.fanIn||0}, risk ${f.risk} — breaking this breaks callers silently.`,fix:"Write characterization tests for its public surface before the next refactor.",files:[f.path]}));
  }

  const sevRank={Critical:0,Warning:1,Info:2};
  out.findings.sort((x,y)=>sevRank[x.sev]-sevRank[y.sev]);
  out.at=new Date().toISOString();
  window.__axAgentRuns[a.id]=out;
  return out;
}

/* ---------- shared recompute (incremental, fast) ---------- */
function recomputeRepo(){
  const r=state.repo; if(!r) return;
  const {edges, modules} = buildGraph(r.files);
  r.edges=edges; r.modules=modules; r.health=computeHealth(r.files, edges);

/* ---------- LIVE WATCH (File System Access API) ---------- */
const live={handle:null,timer:null,seen:new Map(),feed:[],busy:false};
async function startLiveWatch(){
  if(!window.showDirectoryPicker){ toast("Live Watch needs Chrome, Edge or Arc"); return; }
  let dir; try{ dir=await window.showDirectoryPicker(); }catch(_){ return; }
  live.handle=dir; live.seen=new Map(); live.feed=[];
  toast("Scanning "+dir.name+" …");
  const list=await liveScan(dir);
  const files=[];
  for(const it of list){ try{ files.push(mkFile(it.path, await (await it.handle.getFile()).text())); }catch(_){} }
  list.forEach(it=>live.seen.set(it.path,it.mtime));
  finalize(dir.name, files);
  liveSetBadge(true);
  clearInterval(live.timer);
  live.timer=setInterval(livePoll, 2500);
  toast("🔴 Live Watch active — edits re-analyze automatically");
}
function stopLiveWatch(){ clearInterval(live.timer); live.timer=null; live.handle=null; liveSetBadge(false); toast("Live Watch stopped"); }
function liveSetBadge(on){ const b=document.getElementById("liveBadge"); if(b) b.style.display=on?"inline-flex":"none"; }
async function liveScan(dir, prefix="", out=[]){
  for await (const [name, h] of dir.entries()){
    const path=prefix+name;
    if(SKIP.test(path)||/^\./.test(name)) continue;
    if(h.kind==="directory"){ if(out.length<4000) await liveScan(h, path+"/", out); }
    else if(CODE_EXT.test(name)){
      let f; try{ f=await h.getFile(); }catch(_){ continue; }
      if(f.size>400*1024) continue;
      out.push({path, handle:h, mtime:f.lastModified});
    }
  }
  return out;
}
async function livePoll(){
  if(!live.handle||live.busy||!state.repo) return;
  live.busy=true;
  try{
    const list=await liveScan(live.handle);
    const now=new Map(list.map(x=>[x.path,x.mtime]));
    const changed=[], added=[], removed=[];
    for(const it of list){
      const prev=live.seen.get(it.path);
      if(prev===undefined) added.push(it); else if(prev!==it.mtime) changed.push(it);
    }
    for(const p of live.seen.keys()) if(!now.has(p)) removed.push(p);
    if(!changed.length && !added.length && !removed.length){ live.busy=false; return; }
    const byPath=new Map(state.repo.files.map(f=>[f.path,f]));
    for(const p of removed) byPath.delete(p);
    for(const it of [...changed,...added]){
      try{ byPath.set(it.path, mkFile(it.path, await (await it.handle.getFile()).text())); }catch(_){}
    }
    state.repo.files=[...byPath.values()];
    live.seen=now;
    const before=state.repo.health.score;
    recomputeRepo();
    const delta=state.repo.health.score-before;
    [...changed.map(c=>["modified",c.path]),...added.map(c=>["added",c.path]),...removed.map(p=>["removed",p])]
      .forEach(([kind,path])=>live.feed.unshift({kind,path,at:Date.now()}));
    live.feed=live.feed.slice(0,40);
    toast(`🔄 ${changed.length+added.length+removed.length} file(s) changed · health ${state.repo.health.score}${delta?` (${delta>0?"+":""}${delta})`:""}`);
    if(["dashboard","graph","review","search"].includes(state.route)) render();
  }catch(_){}
  live.busy=false;
}

/* ---------- COMMAND PALETTE ---------- */
(function buildPalette(){
  const el=document.createElement("div");
  el.id="axPal";
  el.innerHTML=`<div id="axPalBox"><input id="axPalIn" placeholder="Jump to a file, view or action…" /><div id="axPalList"></div></div>`;
  document.body.appendChild(el);
  const inp=el.querySelector("#axPalIn"), listEl=el.querySelector("#axPalList");
  let items=[], sel=0;
  function commands(){
    const c=routes.filter(r=>r.id!=="welcome"||!state.repo).map(r=>({label:r.label, hint:"View", run:()=>go(r.id)}));
    c.push({label:"Run all agents", hint:"Action", run:()=>{ go("agents"); setTimeout(()=>document.getElementById("runAll")?.click(),60); }});
    c.push({label:"Export findings (.md)", hint:"Action", run:()=>state.repo&&window.__axExportFindings()});
    c.push({label:"Export snapshot (.json)", hint:"Action", run:exportSnapshot});
    c.push({label:"Import snapshot (.json)", hint:"Action", run:importSnapshot});
    c.push({label: live.timer?"Stop Live Watch":"Start Live Watch", hint:"Action", run:()=> live.timer?stopLiveWatch():startLiveWatch()});
    c.push({label:"Reset repository", hint:"Action", run:()=>{ state.repo=null; localStorage.removeItem(LS); go("welcome"); }});
    return c;
  }
  function score(q,s){ s=s.toLowerCase(); let i=0,sc=0; for(const ch of q){ const k=s.indexOf(ch,i); if(k<0) return -1; sc+= k===i?2:1; i=k+1; } return sc - s.length*0.01; }
  function refresh(){
    const q=inp.value.trim().toLowerCase();
    const pool=[...commands(), ...((state.repo?.files)||[]).map(f=>({label:f.path, hint:f.lang+" · risk "+f.risk, run:()=>openFile(f.path)}))];
    items = (q? pool.map(o=>({o,s:score(q,o.label)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.o) : pool).slice(0,60);
    sel=0; draw();
  }
  function draw(){
    listEl.innerHTML=items.map((o,i)=>`<div class="axPalRow ${i===sel?'sel':''}" data-i="${i}"><span>${escapeHtml(o.label)}</span><span class="k">${escapeHtml(o.hint||"")}</span></div>`).join("")||`<div class="axPalRow dim">No matches</div>`;
    listEl.querySelectorAll(".axPalRow[data-i]").forEach(r=>r.onclick=()=>pick(+r.dataset.i));
    const s=listEl.querySelector(".sel"); if(s) s.scrollIntoView({block:"nearest"});
  }
  function pick(i){ const o=items[i]; close(); if(o) o.run(); }
  function open(){ el.classList.add("open"); inp.value=""; refresh(); inp.focus(); }
  function close(){ el.classList.remove("open"); }
  window.__axPalette=open;
  inp.addEventListener("input",refresh);
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(items.length-1,sel+1);draw();}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw();}
    else if(e.key==="Enter"){e.preventDefault();pick(sel);}
    else if(e.key==="Escape"){close();}
  });
  el.addEventListener("click",e=>{ if(e.target===el) close(); });
  document.getElementById("btnPalette").onclick=open;
})();

/* ---------- PR / DIFF REVIEW ---------- */
function parseDiff(text){
  const out={}; let cur=null;
  for(const raw of text.split("\n")){
    let m=raw.match(/^\+\+\+\s+(?:b\/)?(.+?)\s*$/);
    if(m){ cur=m[1]==="/dev/null"?null:m[1]; if(cur) out[cur]||={add:0,del:0}; continue; }
    if(/^(diff --git|index |--- )/.test(raw)) continue;
    if(!cur) continue;
    if(/^\+/.test(raw)) out[cur].add++;
    else if(/^-/.test(raw)) out[cur].del++;
  }
  return Object.entries(out).map(([path,v])=>({path,...v}));
}
function blastRadius(path){
  const rev={}; state.repo.edges.forEach(([a,b])=>{(rev[b]||=[]).push(a)});
  const seen=new Set(), q=[path];
  while(q.length){ const p=q.shift(); for(const d of (rev[p]||[])) if(!seen.has(d)){ seen.add(d); q.push(d); } }
  return [...seen];
}
function matchRepoFile(p){
  const f=state.repo.files;
  return f.find(x=>x.path===p) || f.find(x=>x.path.endsWith("/"+p)) || f.find(x=>p.endsWith("/"+x.path)) || null;
}
function viewReview(root){
  root.innerHTML=`
  <div class="card big">
    <div class="card-h"><h4>PR Review — paste a diff, get a merge verdict</h4></div>
    <div class="card-b">
      <div class="dim" style="font-size:12px;margin-bottom:8px">Paste the output of <code>git diff</code>, <code>git diff main...HEAD</code>, or a GitHub <code>.diff</code>. Axiom maps every touched file to its real blast radius, risk, effort and reviewers.</div>
      <textarea id="rvIn" style="width:100%;height:180px;background:#080b12;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:ui-monospace,monospace;font-size:12px;padding:10px" placeholder="diff --git a/src/auth/service.ts b/src/auth/service.ts&#10;--- a/src/auth/service.ts&#10;+++ b/src/auth/service.ts&#10;+  const token = sign(payload)"></textarea>
      <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
        <button class="primary" id="rvGo">⚡ Review changes</button>
        <button id="rvSnap">⇩ Export snapshot</button>
        <button id="rvImp">⇧ Import snapshot</button>
      </div>
    </div>
  </div>
  <div id="rvOut"></div>
  ${live.feed.length?`<div class="card big"><div class="card-h"><h4>Live change feed</h4></div><div class="card-b" style="padding:0"><div class="file-list">${live.feed.map(f=>`<div style="display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px"><span class="risk ${f.kind==="removed"?"bad":f.kind==="added"?"ok":"warn"}" style="padding:1px 8px;border-radius:4px;font-size:10px">${f.kind}</span><span>${escapeHtml(f.path)}</span><span class="dim" style="margin-left:auto">${new Date(f.at).toLocaleTimeString()}</span></div>`).join("")}</div></div></div>`:""}`;
  root.querySelector("#rvSnap").onclick=exportSnapshot;

      return {...c, f, down, risk, score, owner:suggestOwner(c.path), effort:estimateEffort(1, down.length)};
    }).sort((a,b)=>b.score-a.score);
    const total=rows.reduce((s,r)=>s+r.add+r.del,0);
    const impacted=new Set(rows.flatMap(r=>r.down)).size;
    const top=rows[0].score;
    const verdict= top>=70?["Needs senior review","bad"] : top>=40?["Review with care","warn"] : ["Safe to merge","ok"];
    out.innerHTML=`

      <div class="card"><h5>Verdict</h5><div class="v" style="font-size:18px;color:var(--${verdict[1]})">${verdict[0]}</div><div class="sub">highest risk ${top}/100</div></div>
      <div class="card"><h5>Files touched</h5><div class="v">${rows.length}</div><div class="sub">${total} lines changed</div></div>
      <div class="card"><h5>Blast radius</h5><div class="v">${impacted}</div><div class="sub">downstream files impacted</div></div>
      <div class="card"><h5>Reviewers</h5><div class="v" style="font-size:16px">${[...new Set(rows.map(r=>r.owner))].slice(0,3).join(", ")}</div><div class="sub">inferred from ownership map</div></div>
    </div>

    <div class="card-b" style="padding:0"><div class="file-list">
