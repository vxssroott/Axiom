/* ============================================================================
   v4 — Institutional Memory Layer
   Bi-temporal fact store · event-sourced log · multi-resolution projections ·
   distillation & governance · MCP tool surface · federation · verification
   ========================================================================== */

const MEM_LS = "axiom.mem.v4";
const SESSION_ID = "sess_" + Math.random().toString(36).slice(2, 8);

const AXM = {
  facts: new Map(),      // key -> fact (current version)
  history: [],           // superseded / invalidated facts (full bi-temporal history)
  log: [],               // append-only event log (source of truth)
  seq: 0,
  skills: [],
  gates: [],
  conflicts: [],
  lastVerify: null,
  asOf: null,            // ms timestamp for as-of queries (null = now)
};

function h32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
function tk(s) { return Math.ceil((typeof s === "string" ? s : JSON.stringify(s)).length / 4); }
function nowTs() { return Date.now(); }
function fmtTime(t) { return new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function fmtDate(t) { return new Date(t).toLocaleString(); }

/* ---------- event log ---------- */
function emit(type, payload) {
  const ev = { seq: ++AXM.seq, ts: nowTs(), type, actor: SESSION_ID, payload };
  AXM.log.push(ev);
  if (AXM.log.length > 6000) AXM.log.splice(0, AXM.log.length - 6000);
  return ev;
}

/* ---------- fact upsert with bi-temporal semantics ---------- */
function upsertFact({ layer, kind, subject, body, validFrom, prov }) {
  const key = layer + "::" + kind + "::" + subject;
  const hash = h32(JSON.stringify(body));
  const prev = AXM.facts.get(key);
  const tx = nowTs();
  if (prev && prev.hash === hash) { prev.observedAt = tx; return prev; }
  if (prev) {
    prev.validTo = validFrom || tx;
    prev.txTo = tx;
    AXM.history.push(prev);
    emit("fact.superseded", { key, from: prev.version, hash: prev.hash });
  }
  const fact = {
    id: "f_" + h32(key) + "_" + ((prev?.version || 0) + 1),
    key, layer, kind, subject, body, hash,
    version: (prev?.version || 0) + 1,
    validFrom: validFrom || tx, validTo: null,
    txAt: tx, txTo: null,
    observedAt: tx,
    prov: prov || {},
  };
  AXM.facts.set(key, fact);
  emit(prev ? "fact.revised" : "fact.created", { key, layer, kind, subject, version: fact.version, hash });
  return fact;
}
function invalidateMissing(seenKeys, layerFilter) {
  const tx = nowTs();
  for (const [key, f] of [...AXM.facts]) {
    if (layerFilter && f.layer !== layerFilter) continue;
    if (seenKeys.has(key)) continue;
    f.validTo = tx; f.txTo = tx;
    AXM.history.push(f); AXM.facts.delete(key);
    emit("fact.invalidated", { key, reason: "subject removed from source" });
  }
}

/* ---------- as-of query ---------- */
function factsAsOf(t) {
  if (!t) return [...AXM.facts.values()];
  const all = [...AXM.facts.values(), ...AXM.history];
  return all.filter(f => f.validFrom <= t && (f.validTo == null || f.validTo > t) && f.txAt <= t);
}

/* ---------- symbol / hotspot extraction ---------- */
const SYM_RE = /(?:^|\n)\s*(?:export\s+)?(?:async\s+)?(?:function|class|def|fn|func|interface|type|struct|impl)\s+([A-Za-z_$][\w$]*)/g;
function symbolsOf(src) { const out = []; let m; SYM_RE.lastIndex = 0; while ((m = SYM_RE.exec(src || "")) && out.length < 60) out.push(m[1]); return out; }

const HOTSPOTS = [
  { id: "todo", re: /\b(TODO|FIXME|HACK|XXX)\b[:\s].{0,90}/g, kind: "debt", sev: "Info" },
  { id: "empty-catch", re: /catch\s*\([^)]*\)\s*\{\s*\}/g, kind: "failure-mode", sev: "Warning" },
  { id: "secret", re: /(api[_-]?key|secret|password|token)\s*[:=]\s*["'][^"']{8,}["']/gi, kind: "security", sev: "Critical" },
  { id: "sql", re: /(SELECT|INSERT|UPDATE|DELETE)\s+[^\n;]*\+\s*\w+/gi, kind: "security", sev: "Critical" },
  { id: "insecure-http", re: /http:\/\/[^\s"'`]+/g, kind: "security", sev: "Warning" },
  { id: "weak-hash", re: /\b(md5|sha1)\b/gi, kind: "security", sev: "Warning" },
  { id: "any-cast", re: /\bas\s+any\b|:\s*any\b/g, kind: "quality", sev: "Info" },
  { id: "sync-io", re: /\b(readFileSync|writeFileSync|execSync)\b/g, kind: "performance", sev: "Warning" },
  { id: "deep-nest", re: /\n\s{20,}\S/g, kind: "quality", sev: "Info" },
  { id: "console", re: /console\.log\(/g, kind: "quality", sev: "Info" },
];
function lineOf(src, idx) { return src.slice(0, idx).split("\n").length; }

/* ---------- projection build (deterministic from repo + log) ---------- */
function buildMemory(reason = "ingest") {
  const r = state.repo; if (!r) return;
  const t0 = performance.now();
  const commit = h32(r.name + ":" + r.files.length + ":" + (r.updatedAt || r.createdAt));
  const validFrom = r.updatedAt || r.createdAt || nowTs();
  const seen = new Set();
  const P = (path, loc) => ({ path, loc: loc || null, commit, session: SESSION_ID, source: r.name });

  /* --- COARSE: architecture, ownership, module contracts, invariants --- */
  const inbound = {}, outbound = {};
  r.edges.forEach(([a, b]) => {
    const ma = fileModule(a), mb = fileModule(b);
    if (ma === mb) return;
    (outbound[ma] ||= new Set()).add(mb);
    (inbound[mb] ||= new Set()).add(ma);
  });
  for (const m of Object.values(r.modules)) {
    const mFiles = r.files.filter(f => f.module === m.name);
    const surface = mFiles.filter(f => f.fanIn > 0).map(f => f.path);
    const invariants = [];
    if (!(outbound[m.name]?.size)) invariants.push("leaf module — imports no sibling module");
    if (surface.length <= Math.max(1, Math.round(mFiles.length * 0.3))) invariants.push("narrow public surface (" + surface.length + "/" + mFiles.length + ")");
    if (mFiles.some(f => /auth|token|session|crypt/i.test(f.path))) invariants.push("security-sensitive: changes require security review");
    const key = "coarse::module.contract::" + m.name; seen.add(key);
    upsertFact({
      layer: "coarse", kind: "module.contract", subject: m.name, validFrom, prov: P(m.name + "/"),
      body: {
        files: m.files, lines: m.lines, languages: Object.keys(m.langs),
        owner: suggestOwner(mFiles[0]?.path || m.name),
        publicSurface: surface.slice(0, 12),
        dependsOn: [...(outbound[m.name] || [])],
        consumedBy: [...(inbound[m.name] || [])],
        invariants,
      }
    });
  }
  const archKey = "coarse::architecture.summary::" + r.name; seen.add(archKey);
  upsertFact({
    layer: "coarse", kind: "architecture.summary", subject: r.name, validFrom, prov: P("/"),
    body: {
      modules: Object.keys(r.modules).length, files: r.files.length, edges: r.edges.length,
      health: r.health.score, highRisk: r.health.highRisk, orphans: r.health.orphans,
      entrypoints: r.files.filter(f => f.fanIn === 0 && f.fanOut > 0).slice(0, 8).map(f => f.path),
      hubs: [...r.files].sort((a, b) => b.fanIn - a.fanIn).slice(0, 8).map(f => f.path + " (fan-in " + f.fanIn + ")"),
    }
  });

  /* --- MID: function/class semantics, dependency edges, impact surfaces --- */
  const capped = [...r.files].sort((a, b) => b.risk - a.risk).slice(0, 1200);
  for (const f of capped) {
    const key = "mid::file.semantics::" + f.path; seen.add(key);
    const blast = blastRadius(f.path);
    upsertFact({
      layer: "mid", kind: "file.semantics", subject: f.path, validFrom, prov: P(f.path),
      body: {
        module: f.module, lang: f.lang, lines: f.lines, risk: f.risk,
        symbols: symbolsOf(f.content || ""),
        fanIn: f.fanIn, fanOut: f.fanOut,
        impactSurface: blast.length,
        downstream: blast.slice(0, 10),
        owner: suggestOwner(f.path),
        effort: estimateEffort(blast.length || 1, f.fanIn),
      }
    });
  }
  r.edges.slice(0, 2500).forEach(([a, b]) => {
    const key = "mid::dependency.edge::" + a + "→" + b; seen.add(key);
    upsertFact({ layer: "mid", kind: "dependency.edge", subject: a + "→" + b, validFrom, prov: P(a), body: { from: a, to: b, crossModule: fileModule(a) !== fileModule(b) } });
  });

  /* --- FINE: exact snippets, failure modes, performance characteristics --- */
  let fineCount = 0;
  for (const f of r.files) {
    const src = f.content; if (!src || fineCount > 900) continue;
    for (const hs of HOTSPOTS) {
      hs.re.lastIndex = 0; let m, n = 0;
      while ((m = hs.re.exec(src)) && n < 4) {
        n++; fineCount++;
        const ln = lineOf(src, m.index);
        const subject = f.path + ":" + ln + ":" + hs.id;
        const key = "fine::" + hs.kind + "::" + subject; seen.add(key);
        upsertFact({
          layer: "fine", kind: hs.kind, subject, validFrom, prov: P(f.path, "L" + ln),
          body: { rule: hs.id, severity: hs.sev, line: ln, snippet: (m[0] || "").slice(0, 160).trim(), owner: suggestOwner(f.path) }
        });
      }
    }
  }
  invalidateMissing(seen);
  emit("projection.rebuilt", { reason, facts: AXM.facts.size, ms: Math.round(performance.now() - t0) });
  runDistillation(true);
  verifyMemory();
  saveMemory();
}
function fileModule(p) { const f = state.repo?.files.find(x => x.path === p); return f ? f.module : moduleOf(p); }

/* ---------- distillation, conflicts, skills ---------- */
function runDistillation(quiet) {
  const facts = [...AXM.facts.values()];
  /* conflict detection: identical symbol defined in many files (contract ambiguity) */
  const symIndex = {};
  facts.filter(f => f.kind === "file.semantics").forEach(f => f.body.symbols.forEach(s => (symIndex[s] ||= []).push(f.subject)));
  const conflicts = [];
  Object.entries(symIndex).forEach(([s, paths]) => {
    if (paths.length >= 3 && s.length > 3) conflicts.push({ type: "ambiguous-symbol", subject: s, detail: paths.length + " definitions of `" + s + "`", refs: paths.slice(0, 6), severity: paths.length > 5 ? "Critical" : "Warning" });
  });
  /* deprecated patterns */
  const dep = {};
  facts.filter(f => f.layer === "fine").forEach(f => (dep[f.body.rule] ||= []).push(f.subject));
  Object.entries(dep).forEach(([rule, refs]) => {
    if (["weak-hash", "insecure-http", "sync-io", "empty-catch"].includes(rule) && refs.length >= 2)
      conflicts.push({ type: "deprecated-pattern", subject: rule, detail: refs.length + " live occurrences of a pattern this codebase has outgrown", refs: refs.slice(0, 6), severity: "Warning" });
  });
  /* ownership conflicts */
  const modOwners = {};
  facts.filter(f => f.kind === "module.contract").forEach(f => (modOwners[f.body.owner] ||= []).push(f.subject));
  Object.entries(modOwners).forEach(([o, mods]) => { if (mods.length > 6) conflicts.push({ type: "ownership-overload", subject: o, detail: o + " owns " + mods.length + " modules — single point of review failure", refs: mods.slice(0, 6), severity: "Info" }); });
  AXM.conflicts = conflicts;

  /* skill extraction: reusable, evidence-backed procedures */
  const skills = [];
  const hubs = facts.filter(f => f.kind === "file.semantics" && f.body.fanIn >= 3).sort((a, b) => b.body.fanIn - a.body.fanIn).slice(0, 5);
  hubs.forEach(f => skills.push({
    id: "skill_" + h32(f.subject), name: "Change " + f.subject.split("/").pop() + " safely",
    when: "Any edit to " + f.subject, doIt: "Run the downstream suite for " + f.body.impactSurface + " dependents; request review from " + f.body.owner + "; expected effort " + f.body.effort.label + ".",
    evidence: [f.id], confidence: Math.min(0.99, 0.55 + f.body.fanIn * 0.05)
  }));
  Object.entries(dep).forEach(([rule, refs]) => {
    if (refs.length < 2) return;
    skills.push({ id: "skill_" + rule, name: "Avoid `" + rule + "`", when: "Writing or reviewing code in this repo", doIt: "This pattern appears " + refs.length + "× and is on the deprecation path. Replace it rather than extend it.", evidence: refs.slice(0, 4), confidence: Math.min(0.95, 0.5 + refs.length * 0.05) });
  });
  const sec = facts.filter(f => f.layer === "fine" && f.body.severity === "Critical");
  if (sec.length) skills.push({ id: "skill_sec_gate", name: "Security gate before merge", when: "Any PR touching " + [...new Set(sec.map(f => f.subject.split(":")[0].split("/")[0]))].slice(0, 3).join(", "), doIt: "Resolve " + sec.length + " critical fine-grained findings before merge; they are pre-action blocking gates.", evidence: sec.slice(0, 4).map(f => f.id), confidence: 0.92 });
  AXM.skills = skills;

  syncGates();
  if (!quiet) { emit("distillation.run", { conflicts: conflicts.length, skills: skills.length }); toast("🧪 Distillation complete — " + conflicts.length + " conflicts, " + skills.length + " skills"); saveMemory(); }
}

/* ---------- governance gates ---------- */
const BASE_GATES = [
  { id: "g_secret", name: "No hardcoded credentials", test: "secret", action: "block", rationale: "Literal secrets in source are unrecoverable once pushed." },
  { id: "g_sql", name: "No string-concatenated SQL", test: "sql", action: "block", rationale: "Concatenated SQL is the top injection vector in this codebase." },
  { id: "g_hash", name: "No MD5/SHA1", test: "weak-hash", action: "warn", rationale: "Deprecated hashes; migrate to SHA-256/argon2." },
  { id: "g_http", name: "No plaintext http://", test: "insecure-http", action: "warn", rationale: "Traffic must be TLS-terminated end to end." },
  { id: "g_catch", name: "No silent catch blocks", test: "empty-catch", action: "warn", rationale: "Swallowed errors are the most expensive incidents to diagnose." },
  { id: "g_syncio", name: "No sync I/O on hot paths", test: "sync-io", action: "warn", rationale: "Blocking I/O stalls the event loop under load." },
  { id: "g_hub", name: "High fan-in files require named reviewer", test: "__hub", action: "warn", rationale: "Files with fan-in ≥ 5 have repo-wide blast radius." },
  { id: "g_crit", name: "Security-sensitive paths require security review", test: "__sensitive", action: "block", rationale: "auth / payment / crypto paths are non-negotiable review gates." },
];
function syncGates() {
  const existing = new Map(AXM.gates.map(g => [g.id, g]));
  AXM.gates = BASE_GATES.map(g => ({ ...g, enabled: existing.has(g.id) ? existing.get(g.id).enabled : true, hits: countGateHits(g) }));
}
function countGateHits(g) {
  const facts = [...AXM.facts.values()];
  if (g.test === "__hub") return facts.filter(f => f.kind === "file.semantics" && f.body.fanIn >= 5).length;
  if (g.test === "__sensitive") return facts.filter(f => f.kind === "file.semantics" && /auth|payment|billing|crypto|secret|session/i.test(f.subject)).length;
  return facts.filter(f => f.layer === "fine" && f.body.rule === g.test).length;
}
function evaluateAction(path, intent) {
  const facts = [...AXM.facts.values()];
  const sem = facts.find(f => f.kind === "file.semantics" && f.subject === path);
  const fine = facts.filter(f => f.layer === "fine" && f.subject.startsWith(path + ":"));
  const triggered = [];
  for (const g of AXM.gates.filter(x => x.enabled)) {
    if (g.test === "__hub") { if (sem && sem.body.fanIn >= 5) triggered.push({ g, why: "fan-in " + sem.body.fanIn }); continue; }
    if (g.test === "__sensitive") { if (/auth|payment|billing|crypto|secret|session/i.test(path)) triggered.push({ g, why: "sensitive path segment" }); continue; }
    const hit = fine.filter(f => f.body.rule === g.test);
    if (hit.length) triggered.push({ g, why: hit.length + "× at " + hit.slice(0, 3).map(f => "L" + f.body.line).join(", ") });
  }
  const blocked = triggered.some(t => t.g.action === "block") && intent !== "read";
  const blast = blastRadius(path);
  return {
    path, intent, blocked, triggered,
    verdict: blocked ? "BLOCKED" : triggered.length ? "PROCEED WITH GATES" : "CLEAR",
    owner: suggestOwner(path),
    impact: blast.length,
    effort: estimateEffort(blast.length || 1, sem?.body.fanIn || 0),
    skills: AXM.skills.filter(s => s.when.includes(path) || s.when.includes("this repo")).slice(0, 3),
  };
}

/* ---------- verification & deterministic replay ---------- */
function verifyMemory() {
  const facts = [...AXM.facts.values()];
  const checks = [];
  checks.push({ name: "Every fact carries provenance", pass: facts.every(f => f.prov && f.prov.commit), detail: facts.filter(f => !f.prov?.commit).length + " missing" });
  checks.push({ name: "No overlapping validity intervals per key", pass: !AXM.history.some(h => AXM.facts.get(h.key) && h.validTo == null), detail: "bi-temporal intervals closed on supersede" });
  checks.push({ name: "Monotonic transaction time", pass: AXM.log.every((e, i) => i === 0 || e.ts >= AXM.log[i - 1].ts), detail: AXM.log.length + " events" });
  const replay = replayProjection();
  checks.push({ name: "Deterministic replay of event log", pass: replay.keys === facts.length, detail: replay.keys + " / " + facts.length + " keys reconstructed" });
  checks.push({ name: "No orphan fine facts", pass: facts.filter(f => f.layer === "fine").every(f => state.repo?.files.some(x => x.path === f.subject.split(":")[0])), detail: "fine facts anchored to live files" });
  AXM.lastVerify = { at: nowTs(), checks, pass: checks.every(c => c.pass) };
  return AXM.lastVerify;
}
function replayProjection() {
  const live = new Set();
  for (const ev of AXM.log) {
    if (ev.type === "fact.created" || ev.type === "fact.revised") live.add(ev.payload.key);
    if (ev.type === "fact.invalidated") live.delete(ev.payload.key);
  }
  return { keys: live.size };
}

/* ---------- persistence ---------- */
function saveMemory() {
  try {
    localStorage.setItem(MEM_LS, JSON.stringify({
      log: AXM.log.slice(-2500), seq: AXM.seq,
      gates: AXM.gates.map(g => ({ id: g.id, enabled: g.enabled })),
      skills: AXM.skills.slice(0, 60),
    }));
  } catch (e) { }
}
function loadMemory() {
  try {
    const d = JSON.parse(localStorage.getItem(MEM_LS) || "null"); if (!d) return;
    AXM.log = d.log || []; AXM.seq = d.seq || 0; AXM.skills = d.skills || [];
    AXM.gates = (d.gates || []).map(g => ({ ...BASE_GATES.find(b => b.id === g.id), ...g }));
  } catch (e) { }
}
loadMemory();

/* ---------- MCP-style tool surface ---------- */
const MCP_TOOLS = [
  {
    name: "memory.structural_query", desc: "Query the graph by module, symbol, language or risk. Returns contracts, not files.",
    args: { subject: "auth", layer: "coarse|mid|fine" },
    run: ({ subject = "", layer = "" }) => {
      const t = AXM.asOf; const f = factsAsOf(t)
        .filter(x => (!layer || x.layer === layer) && (!subject || (x.subject + JSON.stringify(x.body)).toLowerCase().includes(String(subject).toLowerCase())))
        .slice(0, 25);
      return { asOf: t ? fmtDate(t) : "now", matches: f.length, facts: f.map(compactFact) };
    }
  },
  {
    name: "memory.impact_analysis", desc: "Full downstream blast radius, effort estimate, reviewers and gates for a change.",
    args: { path: state?.repo?.files?.[0]?.path || "src/index.ts" },
    run: ({ path }) => {
      const blast = blastRadius(path); const g = evaluateAction(path, "edit");
      return { path, verdict: g.verdict, impactedFiles: blast.length, impacted: blast.slice(0, 25), owner: g.owner, effort: g.effort, gates: g.triggered.map(t => t.g.name) };
    }
  },
  {
    name: "memory.temporal_diff", desc: "What changed in the knowledge layer between two points in time.",
    args: { sinceMinutes: 60 },
    run: ({ sinceMinutes = 60 }) => {
      const cut = nowTs() - sinceMinutes * 60000;
      const evs = AXM.log.filter(e => e.ts >= cut);
      const by = {}; evs.forEach(e => by[e.type] = (by[e.type] || 0) + 1);
      return { window: sinceMinutes + "m", events: evs.length, byType: by, revised: evs.filter(e => e.type === "fact.revised").slice(-10).map(e => e.payload.key) };
    }
  },
  {
    name: "memory.skill_recall", desc: "Recall distilled, evidence-backed procedures for a task.",
    args: { task: "edit auth" },
    run: ({ task = "" }) => ({ task, skills: AXM.skills.filter(s => !task || (s.name + s.when + s.doIt).toLowerCase().includes(task.toLowerCase())).slice(0, 8) })
  },
  {
    name: "memory.ownership_lookup", desc: "Who owns a path, and which reviewers are mandatory.",
    args: { path: state?.repo?.files?.[0]?.path || "src/index.ts" },
    run: ({ path }) => ({ path, owner: suggestOwner(path), module: fileModule(path), mandatory: /auth|payment|crypto/i.test(path) ? ["@security-team"] : [] })
  },
  {
    name: "memory.path_find", desc: "Multi-hop dependency path between two files.",
    args: { from: state?.repo?.files?.[0]?.path || "a.ts", to: state?.repo?.files?.[1]?.path || "b.ts" },
    run: ({ from, to }) => ({ from, to, path: findPath(from, to) })
  },
  {
    name: "memory.as_of", desc: "Pin every subsequent query to a past point in time.",
    args: { minutesAgo: 0 },
    run: ({ minutesAgo = 0 }) => { AXM.asOf = minutesAgo ? nowTs() - minutesAgo * 60000 : null; return { asOf: AXM.asOf ? fmtDate(AXM.asOf) : "now (live)", visibleFacts: factsAsOf(AXM.asOf).length }; }
  },
  {
    name: "governance.pre_action_gate", desc: "Ask permission BEFORE acting. Returns BLOCKED / gated / clear.",
    args: { path: state?.repo?.files?.[0]?.path || "src/index.ts", intent: "edit" },
    run: ({ path, intent = "edit" }) => { const v = evaluateAction(path, intent); emit("gate.evaluated", { path, verdict: v.verdict }); return { verdict: v.verdict, blocked: v.blocked, gates: v.triggered.map(t => ({ gate: t.g.name, action: t.g.action, why: t.why, rationale: t.g.rationale })), owner: v.owner, impact: v.impact }; }
  },
];
function compactFact(f) { return { id: f.id, layer: f.layer, kind: f.kind, subject: f.subject, v: f.version, validFrom: fmtDate(f.validFrom), prov: f.prov.path + (f.prov.loc ? "#" + f.prov.loc : "") + "@" + f.prov.commit, body: f.body }; }
function findPath(from, to) {
  const adj = {}; (state.repo?.edges || []).forEach(([a, b]) => (adj[a] ||= []).push(b));
  const q = [[from]], seen = new Set([from]);
  while (q.length) { const p = q.shift(); const last = p[p.length - 1]; if (last === to) return p; if (p.length > 8) continue; for (const n of adj[last] || []) if (!seen.has(n)) { seen.add(n); q.push([...p, n]); } }
  return null;
}
function baselineTokensFor(result) {
  const r = state.repo; if (!r) return 0;
  const paths = new Set(JSON.stringify(result).match(/[\w./-]+\.(ts|tsx|js|jsx|py|go|rs|java|rb|php|css|html|md|json|yml|yaml)/g) || []);
  let base = 0, n = 0;
  for (const f of r.files) { if (paths.has(f.path) || n < 12) { base += tk(f.content || ""); n++; } }
  if (!base) base = r.files.slice(0, 12).reduce((s, f) => s + tk(f.content || ""), 0);
  return base;
}

/* ---------- shared graph utilities ---------- */
function revIndex(){ const rev={}; state.repo.edges.forEach(([a,b])=>{(rev[b]||=[]).push(a)}); return rev; }
function fwdIndex(){ const f={}; state.repo.edges.forEach(([a,b])=>{(f[a]||=[]).push(b)}); return f; }
function findCycles(limit=12){
  const fwd=fwdIndex(), color={}, stack=[], out=[];
  const nodes=state.repo.files.map(f=>f.path);
  function dfs(n){
    if(out.length>=limit) return;
    color[n]=1; stack.push(n);
    for(const m of (fwd[n]||[])){
      if(color[m]===1){ const i=stack.indexOf(m); if(i>=0) out.push(stack.slice(i).concat(m)); }
      else if(!color[m]) dfs(m);
    }
    stack.pop(); color[n]=2;
  }
  for(const n of nodes){ if(!color[n]) dfs(n); }
  return out;
}
function waveOrder(root){
  // reverse-dependency BFS layers = safe migration ordering
  const rev=revIndex(), seen=new Set([root]), waves=[]; let frontier=[root];
  while(frontier.length && waves.length<8){
    const next=[];
    for(const p of frontier) for(const d of (rev[p]||[])) if(!seen.has(d)){ seen.add(d); next.push(d); }
    if(!next.length) break;
    waves.push(next); frontier=next;
  }
  return waves;
}
function fileByPath(p){ return state.repo.files.find(f=>f.path===p); }
function repoTokens(){ return state.repo.files.reduce((s,f)=>s+tk(f.content||f.path),0); }

/* ================= 1. CONTEXT COMPILER ================= */
function compilePack(task, budget){
  const terms=(task.toLowerCase().match(/[a-z_][a-z0-9_]{2,}/g)||[]);
  const uniq=[...new Set(terms)];
  const scored = state.repo.files.map(f=>{
    const hay=(f.path+" "+(f.tokens||[]).join(" ")).toLowerCase();
    let s=0;
    for(const t of uniq){
      if(f.path.toLowerCase().includes(t)) s+=6;
      if(hay.includes(t)) s+=2;
    }
    s += Math.min(10,(f.fanIn||0))*0.8;
    s += (f.risk||0)/25;
    return {f, s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);

  const picked=[]; let used=0;
  const head = [
    `# Context pack — ${state.repo.name}`,
    `Task: ${task}`,
    `Repo: ${state.repo.files.length} files · health ${state.repo.health.score}/100 · ${Object.keys(state.repo.modules).length} modules`,
    ``,
    `## Architecture`,
    Object.values(state.repo.modules).sort((a,b)=>b.lines-a.lines).slice(0,8)
      .map(m=>`- ${m.name}: ${m.files} files, ${m.lines} lines (${Object.keys(m.langs).join(", ")})`).join("\n"),
    ``,
    `## Invariants`,
    (typeof BASE_GATES!=="undefined"?BASE_GATES:[]).slice(0,5).map(g=>`- [${g.mode||g.severity||"warn"}] ${g.name||g.id}`).join("\n") || "- none declared",
    ``,
    `## Relevant surfaces`
  ].join("\n");
  used = tk(head);

  const sections=[];
  for(const {f,s} of scored){
    const syms = (typeof symbolsOf==="function"? symbolsOf(f.content||"") : []).slice(0,10);
    const down = blastRadius(f.path).slice(0,6);
    const body = [
      `### ${f.path}  (${f.lang}, ${f.lines} lines, fan-in ${f.fanIn||0}, risk ${f.risk||0})`,
      syms.length?`symbols: ${syms.join(", ")}`:null,
      f.imports&&f.imports.length?`imports: ${f.imports.slice(0,8).join(", ")}`:null,
      down.length?`downstream: ${down.join(", ")}${blastRadius(f.path).length>6?" …":""}`:null,
      `owner: ${suggestOwner(f.path)}`
    ].filter(Boolean).join("\n");
    const cost=tk(body);
    if(used+cost>budget) break;
    used+=cost; sections.push({path:f.path, score:s, cost, body});
  }
  const text = head+"\n\n"+sections.map(s=>s.body).join("\n\n")+
    `\n\n## Contract\nAnswer only from the facts above. If a fact is missing, call memory.structural_query rather than guessing.\n`;
  return {text, used:tk(text), sections, considered:scored.length};
}

/* ================= 2. ARCHITECTURE FITNESS FUNCTIONS ================= */
const FIT_LS="axiom.fitness.v5", FIT_HIST="axiom.fitness.hist.v5";
const DEFAULT_RULES=[
  {id:"no-cycles", name:"No circular dependencies", type:"cycles", severity:"critical"},
  {id:"fan-in",    name:"Fan-in ceiling", type:"maxFanIn", limit:12, severity:"warn"},
  {id:"file-size", name:"File size ceiling", type:"maxLines", limit:400, severity:"warn"},
  {id:"orphans",   name:"Orphan ratio under 15%", type:"maxOrphanPct", limit:15, severity:"warn"},
  {id:"layering",  name:"UI must not reach the data layer directly", type:"forbidEdge",
   from:"(components|ui|pages|views|routes)", to:"(db|database|repositor|prisma|sql|dao)", severity:"critical"},
  {id:"secrets",   name:"No hardcoded credentials", type:"forbidContent",
   pattern:"(api[_-]?key|secret|password|passwd|token)\\s*[:=]\\s*[\"'][A-Za-z0-9_\\-]{12,}", severity:"critical"}
];
function fitRules(){ try{ const r=JSON.parse(localStorage.getItem(FIT_LS)); if(Array.isArray(r)&&r.length) return r; }catch(e){} return DEFAULT_RULES; }
function fitSave(r){ try{ localStorage.setItem(FIT_LS, JSON.stringify(r)); }catch(e){} }
function evalRule(r){
  const files=state.repo.files, v=[];
  try{
    if(r.type==="cycles"){
      findCycles(10).forEach(c=>v.push({path:c[0], detail:c.map(p=>p.split("/").pop()).join(" → ")}));
    } else if(r.type==="maxFanIn"){
      files.filter(f=>(f.fanIn||0)>r.limit).forEach(f=>v.push({path:f.path, detail:`fan-in ${f.fanIn} > ${r.limit}`}));
    } else if(r.type==="maxLines"){
      files.filter(f=>f.lines>r.limit).forEach(f=>v.push({path:f.path, detail:`${f.lines} lines > ${r.limit}`}));
    } else if(r.type==="maxOrphanPct"){
      const orph=files.filter(f=>!state.repo.edges.find(e=>e[0]===f.path||e[1]===f.path));
      const pct=Math.round(orph.length/Math.max(1,files.length)*100);
      if(pct>r.limit) v.push({path:"(repository)", detail:`${pct}% orphaned files > ${r.limit}%`});
    } else if(r.type==="forbidEdge"){
      const from=new RegExp(r.from,"i"), to=new RegExp(r.to,"i");
      state.repo.edges.filter(([a,b])=>from.test(a)&&to.test(b)).forEach(([a,b])=>v.push({path:a, detail:`imports ${b}`}));
    } else if(r.type==="forbidContent"){
      const re=new RegExp(r.pattern,"i");
      files.filter(f=>f.content&&re.test(f.content)).forEach(f=>v.push({path:f.path, detail:"matched forbidden pattern"}));
    }
  }catch(e){ v.push({path:"(rule)", detail:"invalid rule: "+e.message}); }
  return {...r, violations:v.slice(0,40), count:v.length, pass:v.length===0};
}
function evalFitness(){
  const results=fitRules().map(evalRule);
  const crit=results.filter(r=>!r.pass&&r.severity==="critical").reduce((s,r)=>s+Math.min(5,r.count),0);
  const warn=results.filter(r=>!r.pass&&r.severity!=="critical").reduce((s,r)=>s+Math.min(8,r.count),0);
  const score=Math.max(0, 100 - crit*9 - warn*2);
  return {results, score};
}
function fitHist(){ try{ return JSON.parse(localStorage.getItem(FIT_HIST)||"[]"); }catch(e){ return []; } }
function fitPush(score){ const h=fitHist(); h.push({t:Date.now(),score}); localStorage.setItem(FIT_HIST, JSON.stringify(h.slice(-40))); return h; }

function viewFitness(root){
  const {results, score}=evalFitness();
  const h=fitPush(score);
  const prev=h.length>1?h[h.length-2].score:score;
  const drift=score-prev;
  root.innerHTML=`
  <div class="card big"><div class="card-h"><h4>Architecture Fitness Functions</h4>
    <span class="chip ${score>=85?'ok':score>=60?'warn':'bad'}" style="margin-left:auto">${score}/100</span></div>
    <div class="card-b">

const SIM_OPS=[
  {id:"delete",  name:"Delete / retire file",       weight:1.0, note:"Every importer must be rewritten or repointed."},
  {id:"breaking",name:"Breaking API change",         weight:0.85,note:"Signature or contract change propagates to all callers."},
  {id:"split",   name:"Split into modules",          weight:0.6, note:"Import paths change; behaviour preserved."},
  {id:"rename",  name:"Rename export / symbol",      weight:0.4, note:"Mechanical, but wide."},
  {id:"perf",    name:"Internal rewrite (no API change)", weight:0.2, note:"Contained — verify via downstream tests only."}
];
function simulate(path, opId){
  const op=SIM_OPS.find(o=>o.id===opId)||SIM_OPS[0];
  const waves=waveOrder(path);
  const total=waves.reduce((s,w)=>s+w.length,0);
  const target=fileByPath(path);
  const risk=Math.min(100, Math.round((target?.risk||0)*0.5 + total*6*op.weight + (target?.fanIn||0)*4*op.weight));
  const verdict = risk>=70?{k:"bad",l:"High blast radius — stage behind a flag"}:risk>=40?{k:"warn",l:"Moderate — land in waves with review"}:{k:"ok",l:"Contained — safe to land directly"};
  const plan=waves.map((w,i)=>{
    const owners=[...new Set(w.map(suggestOwner))];
    return {n:i+1, files:w, owners, effort:estimateEffort(w.length, w.length*2)};
  });
  const hours = plan.reduce((s,p)=>s + p.files.length * (op.weight*1.5+0.5), (target?.lines||0)/200);
  return {op, waves:plan, total, risk, verdict, hours:Math.max(1,Math.round(hours)), target};
}

/* ---------- license model ---------- */
function license(){
  try{
    const l=JSON.parse(localStorage.getItem(LIC_LS)||"null");
    if(!l) return {plan:"free", billing:null, verified:false};
    const p=PLANS.find(x=>x.id===l.plan)||PLANS[0];
    const lic={ ...p, ...l, plan:l.plan||"free", billing:l.billing||(l.plan==="life"?"once":null) };
    if(l.expires && Date.now()>l.expires) return {plan:"free", billing:null, verified:false, expired:true, prev:lic};
    if(!l.license && l.plan!=="free") lic.verified="client";   // legacy / local-only grant
    return lic;
  }catch(e){ return {plan:"free", billing:null, verified:false}; }
}
function tier(){ return license().plan || "free"; }
function hasAccess(routeId){
  const need=PREMIUM[routeId]; if(!need) return true;
  return RANK[tier()] >= RANK[need];
}
function planPrice(p, billing){
  if(!p.price) return null;
  const b = p.unlimited ? "once" : billing;
  return p.price[b] || p.price.monthly || null;
}
function allowanceOf(lic){
  if(!lic) return null;
  const p=PLANS.find(x=>x.id===lic.plan);
  if(p && p.unlimited) return null;
  const src = lic.allowance!=null ? lic.allowance : (p?p.allowance:null);
  if(typeof src==="object") return src[lic.billing] ?? src.monthly ?? null;
  return src;
}
function saveLicense(lic){ localStorage.setItem(LIC_LS, JSON.stringify(lic)); }
function grant(planId, asset, txid, opts={}){
  const p=PLANS.find(x=>x.id===planId);
  const billing=opts.billing || (p.unlimited?"once":"monthly");
  const days = billing==="annual"?365 : billing==="monthly"?30 : null;
  const lic={
    plan:planId, billing, asset, txid,
    at:Date.now(),
    expires: days? Date.now()+days*864e5 : null,
    allowance: allowanceOf({plan:planId, billing, allowance:p.allowance, unlimited:p.unlimited}),
    verified: opts.verified || (opts.license?"signed":"client"),
    license: opts.license || null,
    paid: opts.paid || null, confirmed: !!opts.confirmed, note: opts.note || null,
  };
  saveLicense(lic);
  resetUsage(lic);
  return lic;
}

function usageInfo(){
  const lic=license(), u=getUsage();
  const allowance=allowanceOf(lic);
  const unlimited = !!lic.unlimited || allowance==null;
  const used = u.used||0;
  const remaining = unlimited ? null : Math.max(0, allowance-used);
  return { lic, allowance, unlimited, used, remaining, exceeded: !unlimited && remaining<=0, pct: unlimited?0:Math.min(100,Math.round(used/Math.max(1,allowance)*100)) };
}

  return u.exceeded;
}
var _axSkipUsage=false;

  amount=Math.max(0, Math.round(amount||0));
  if(!amount) return;

/* ---------- server-authoritative premium authorization (POST /api/billing/consume) ----------
   The browser is NEVER the authority. A signed license (or a free-tier client
   subject) + an idempotency key go to the billing service, which atomically
   checks and increments server-side usage and returns the authoritative state.
   Local payment verification (verified==="client") cannot authorize server-
   metered usage — that path is blocked, not silently downgraded. */
const SUB_LS = "axSubject";
let _authState = null; // "verified" | "rejected" | "unavailable"
async function serverConsume(operation, units){
  const lic=license();
  const request_id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():("r-"+Date.now().toString(36)+Math.random().toString(36).slice(2));
  let body;
  if(lic && lic.license && lic.verified==="signed"){
    body={license:lic.license, units, operation, request_id};
  } else if(lic && lic.verified==="client"){
    // Payment verification fallback must never become an entitlement bypass.
    _authState="rejected";
    return {allowed:false, reason:"local_payment_only", status:200,
      message:"Local payment verification cannot authorize server-metered usage — reconnect the billing service to confirm your payment.", state:null};
  } else {
    body={plan:"free", subject:clientSubject(), units, operation, request_id};
  }
  const res=await billingPost("/api/billing/consume", body);
  const j=res.json||{};
  if(res.ok && j.allowed){
    _authState="verified";
    if(j.used!=null){ try{ const u=getUsage(); u.used=j.used; localStorage.setItem(USG_LS, JSON.stringify(u)); }catch(e){} }
    return {allowed:true, reason:null, message:"", state:j, status:res.status};
  }
  if(res.ok && j.allowed===false){
    _authState="rejected";
    return {allowed:false, reason:j.reason||"denied", message:j.message||"", state:j, status:res.status};
  }
  _authState = (res.status===0||res.status===503) ? "unavailable" : "rejected";
  return {allowed:false, reason:(j.reason||(res.status===503?"billing_unavailable":"network")),
    message:j.message||"Billing service unreachable — premium operation blocked (fail closed).",
    state:j, status:res.status};
}
function clientSubject(){
  try{
    let s=localStorage.getItem(SUB_LS);
    if(!s){ s=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():("ax-"+Math.random().toString(36).slice(2)+Date.now().toString(36)); localStorage.setItem(SUB_LS,s); }
    return s;
  }catch(e){ return "ax-"+Math.random().toString(36).slice(2)+Date.now().toString(36); }
}

async function billingPost(path, body){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 12000);
  try{
    const r=await fetch(BILLING_BASE+path, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body), signal:ctl.signal});
    const j=await r.json().catch(()=>({}));
    return {ok:r.ok, status:r.status, json:j};
  }catch(e){
    return {ok:false, status:0, json:{error:"network"}};
  }finally{ clearTimeout(to); }
}

/* ---------- free public-blockchain verification (local fallback only) ---------- */
async function verifyBtc(txid, minBtc){
  const r=await fetch("https://blockstream.info/api/tx/"+encodeURIComponent(txid.trim()));
  if(!r.ok) throw new Error("Transaction not found on the Bitcoin network.");
  const tx=await r.json();
  const sats=(tx.vout||[]).filter(o=>o.scriptpubkey_address===PAY.btc).reduce((a,o)=>a+o.value,0);
  const paid=sats/1e8;
  if(paid<=0) throw new Error("This transaction does not pay the Axiom BTC address.");
  if(paid+1e-8 < minBtc) throw new Error(`Underpaid: ${paid} BTC received, ${minBtc} BTC required.`);
  const conf=tx.status && tx.status.confirmed;
  if(!conf) throw new Error("Payment detected but not yet confirmed — wait for the transaction to confirm, then retry.");
  return { ok:true, paid, confirmed:true, note:`Confirmed in block ${tx.status.block_height}` };
}
async function verifyUsdt(txhash, minUsdt){
  const h=txhash.trim();
  const r=await fetch("https://api.ethplorer.io/getTxInfo/"+encodeURIComponent(h)+"?apiKey=freekey");
  if(!r.ok) throw new Error("Transaction not found on Ethereum.");
  const tx=await r.json();
  if(tx.error) throw new Error(tx.error.message||"Transaction not found on Ethereum.");
  const ops=(tx.operations||[]).filter(o=>
    (o.type==="transfer") &&
    (o.contract||o.tokenInfo?.address||"").toLowerCase()===PAY.usdtContract &&
    (o.to||"").toLowerCase()===PAY.usdt.toLowerCase());
  if(!ops.length) throw new Error("No USDT transfer to the Axiom address in this transaction.");
  const dec=Number(ops[0].tokenInfo?.decimals||6);
  const paid=ops.reduce((a,o)=>a+Number(o.value)/Math.pow(10,dec),0);
  if(paid+0.01 < minUsdt) throw new Error(`Underpaid: ${paid.toFixed(2)} USDT received, ${minUsdt} USDT required.`);
  if(!tx.success) throw new Error("Payment detected but not yet confirmed — wait for the transaction to confirm, then retry.");
  return { ok:true, paid, confirmed:true, note:`Confirmed · ${tx.confirmations||0} confirmations` };
}

      return `<div class="card big" style="${ctx&&ctx.need===p.id?'border-color:var(--accent)':''}">
        <div class="card-h"><h4>${p.name}</h4>${owned?`<span class="chip" style="margin-left:auto;color:var(--ok)">Active</span>`:""}</div>
        <div class="card-b">
          ${pr?`<div style="font-size:24px">$${pr.usd}<span class="dim" style="font-size:12px"> ${p.unlimited?"once":period==="annual"?"/ year":"/ month"}</span></div>`:`<div style="font-size:24px">Free</div>`}
          <div class="dim" style="font-size:11px;margin:6px 0 10px">${escapeHtml(p.blurb)}</div>
          ${pr?`<div style="font-family:var(--mono);font-size:11px;line-height:1.8">
            <div>₿ <b>${pr.btc}</b> BTC</div>
            <div>₮ <b>${pr.usdt}</b> USDT <span class="dim">(ERC-20)</span></div></div>`:""}
          <div style="margin-top:10px;font-size:12px;line-height:1.9">${p.feats.map(f=>`<div>• ${escapeHtml(f)}</div>`).join("")}</div>
          <div style="margin-top:8px;font-size:11px;color:var(--ink-dim)">Allowance: ${p.unlimited?"unlimited":(allow??0).toLocaleString()+" tok"}${p.unlimited?"":" / "+(period==="annual"?"year":"month")}</div>
          ${pr?`<button class="primary buyBtn" data-p="${p.id}" style="margin-top:12px;width:100%">${owned?"Extend / renew with crypto":"Pay with crypto"}</button>`:""}
        </div></div>`;
    }).join("")}
  </div>

  <div class="card big" id="paybox" style="margin-top:14px;display:none"><div class="card-h"><h4>Checkout</h4>
    <span class="dim" id="payplan" style="font-size:11px;margin-left:auto"></span></div>
    <div class="card-b">
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button class="asset primary" data-a="btc">₿ Bitcoin</button>
        <button class="asset" data-a="usdt">₮ USDT (ERC-20)</button>
      </div>
      <div class="dim" style="font-size:12px">Send exactly <b id="payamt" style="color:var(--ink)"></b> to:</div>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
        <code id="payaddr" style="font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--panel);padding:8px 10px;border-radius:6px;flex:1"></code>
        <button id="paycopy">Copy</button>
      </div>
      <div class="dim" style="font-size:11px">Then paste the transaction hash below. The billing service verifies it against public blockchain nodes and issues a signed license — Axiom never touches your keys.</div>
      <div class="row" style="margin-top:10px">
        <input id="paytx" placeholder="Transaction hash / txid" style="flex:1" />
        <button class="primary" id="payverify">Verify payment</button>
      </div>
      <div id="payout" style="margin-top:10px;font-size:12px"></div>
    </div></div>

  ${t!=="free"?`<div style="margin-top:12px"><button id="licclear">Remove local license</button></div>`:""}`;

  function pendInfo(){
    try{ return JSON.parse(localStorage.getItem(PEND_LS)||"null"); }catch(e){ return null; }
  }
  async function recheckPending(){
    const pend=pendInfo(), el=document.getElementById("bsBody");
    if(!pend || !el) return;
    el.innerHTML=`<span class="dim">Re-checking payment confirmation…</span>`;
    const res=await billingPost("/api/billing/verify", {txid:pend.txid, asset:pend.asset, plan:pend.plan, billing:pend.billing});
    if(res.json && res.json.state==="pending"){ toast("⏳ Still awaiting confirmation — re-check again shortly."); paintStatus(); return; }
    if(res.ok && res.json && res.json.ok){
      const j=res.json, p=PLANS.find(x=>x.id===pend.plan)||PLANS[0];
      try{ localStorage.removeItem(PEND_LS); }catch(e){}
      grant(pend.plan, pend.asset, pend.txid, {billing:pend.billing, license:j.license, verified:"signed", paid:j.paid, confirmed:j.confirmed, note:j.note});
      toast(`✓ ${p.name} unlocked — signed license issued`);
      paintStatus();
      return;
    }
    try{ localStorage.removeItem(PEND_LS); }catch(e){}
    paintStatus();
    toast("⚠ Payment could not be confirmed — re-submit it from Pricing.");
  }
  function paintStatus(){
    const el=document.getElementById("bsBody"); if(!el) return;
    const lic=license(), ui=usageInfo();
    const p=PLANS.find(x=>x.id===lic.plan)||PLANS[0];
    const pend=pendInfo();
    const vBadge = lic.verified==="signed" ? `<span style="color:var(--ok)">✓ server-verified license</span>`
      : lic.verified==="client" ? `<span style="color:var(--warn)">⚠ local verification — billing service unreachable</span>`
      : `<span class="dim">not subscribed</span>`;
    el.innerHTML = `
      ${pend?`<div style="background:var(--panel-2);border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">⏳ <b>Payment detected</b> (${escapeHtml((pend.asset||"").toUpperCase())} · ${escapeHtml(pend.txid).slice(0,12)}…) — awaiting on-chain confirmation. No license issued yet. <button id="bsRecheck" style="margin-left:auto">Re-check</button></div>`:""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <span class="chip"><b>${p.name}</b></span>
        ${lic.billing?`<span class="chip">${billingLabel(lic.billing)}</span>`:""}
        ${vBadge}
        ${_authState?`<span class="chip" style="color:${_authState==="verified"?"var(--ok)":_authState==="rejected"?"var(--bad)":"var(--warn)"}">SERVER ${_authState==="verified"?"VERIFIED":_authState==="rejected"?"REJECTED":"UNAVAILABLE"}</span>`:""}
        ${lic.paid!=null?`<span class="chip">${escapeHtml(lic.paid)} ${(lic.asset||"").toUpperCase()}${lic.confirmed?" · confirmed":" · provisional (0-conf)"}</span>`:""}
        ${lic.txid?`<span class="chip mono" title="${escapeHtml(lic.txid)}">tx ${escapeHtml(lic.txid).slice(0,10)}…</span>`:""}
      </div>
      ${lic.plan!=="free"?`
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">
        <div><div class="dim" style="font-size:11px">Status</div><div style="font-size:14px;color:${lic.expired?'var(--bad)':'var(--ok)'}">${lic.expired?"Expired":"Active"}</div></div>
        <div><div class="dim" style="font-size:11px">Renewal / expiration</div><div style="font-size:14px">${lic.expires? new Date(lic.expires).toLocaleDateString():"Lifetime"}</div></div>
        <div><div class="dim" style="font-size:11px">Payment status</div><div style="font-size:14px">${lic.confirmed===false?"Pending confirmation":"Verified on-chain"}</div></div>
      </div>`:""}
      <div style="margin-top:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
          <span class="dim">Token allowance</span>
          <span>${ui.unlimited?"Unlimited":`${ui.used.toLocaleString()} / ${ui.allowance.toLocaleString()} used${ui.exceeded?' <span style="color:var(--bad)">· exceeded</span>':""}`}</span>
        </div>
        ${ui.unlimited?`<div class="dim" style="font-size:11px">No usage limit on this plan.</div>`:`
        <div style="height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden"><div style="height:100%;width:${ui.pct}%;background:${ui.pct>=100?"var(--bad)":ui.pct>=80?"var(--warn)":"var(--accent)"}"></div></div>
        <div class="dim" style="font-size:11px;margin-top:4px">${ui.exceeded?"Allowance exceeded — renew or upgrade to continue using premium tooling.":ui.remaining.toLocaleString()+" tokens remaining this period."}</div>
        ${_authState==="unavailable"?'<div class="dim" style="font-size:11px;margin-top:4px;color:var(--warn)">Billing service unavailable — premium operations are blocked (fail closed) until the service returns.</div>':""}`}
      </div>`;
    const rk=document.getElementById("bsRecheck");
    if(rk) rk.onclick=recheckPending;
  }
  async function refreshStatus(){
    const el=document.getElementById("bsBody"); if(!el) return;
    const lic=license();
    if(lic && lic.license && lic.verified==="signed"){
      el.innerHTML=`<span class="dim">Checking license with billing service…</span>`;
      try{
        const r=await fetch(BILLING_BASE+"/api/billing/status?license="+encodeURIComponent(lic.license));
        const j=await r.json().catch(()=>({}));
        if(r.ok && j.ok && j.used!=null){
          const u=getUsage(); u.used=j.used;
          try{ localStorage.setItem(USG_LS, JSON.stringify(u)); }catch(e){}
        }
      }catch(e){}
    }
    paintStatus();
  }

  let plan=PLANS.find(p=>p.id==="pro"), asset="btc";
  const box=document.getElementById("paybox");
  function paint(){
    const pr=planPrice(plan, period);
    document.getElementById("payplan").textContent=`${plan.name} · ${billingLabel(plan.unlimited?"once":period)} · $${pr?pr.usd:"—"}`;
    document.getElementById("payamt").textContent = asset==="btc"? (pr?pr.btc+" BTC":"—") : (pr?pr.usdt+" USDT":"—");
    document.getElementById("payaddr").textContent = asset==="btc"? PAY.btc : PAY.usdt;
    root.querySelectorAll(".asset").forEach(b=>b.classList.toggle("primary", b.dataset.a===asset));
  }
  document.getElementById("perMonthly").onclick=()=>{ axPeriod="monthly"; render(); };
  document.getElementById("perAnnual").onclick=()=>{ axPeriod="annual"; render(); };
  root.querySelectorAll(".buyBtn").forEach(b=>b.onclick=()=>{
    plan=PLANS.find(p=>p.id===b.dataset.p); box.style.display=""; paint();
    box.scrollIntoView({behavior:"smooth",block:"center"});
  });
  root.querySelectorAll(".asset").forEach(b=>b.onclick=()=>{ asset=b.dataset.a; paint(); });
  document.getElementById("paycopy").onclick=()=>copyText(asset==="btc"?PAY.btc:PAY.usdt);
  document.getElementById("payverify").onclick=async ()=>{
    const out=document.getElementById("payout"), tx=document.getElementById("paytx").value.trim();
    if(!tx){ out.innerHTML=`<span style="color:var(--warn)">Paste the transaction hash first.</span>`; return; }
    const pr=planPrice(plan, period);
    if(!pr){ out.innerHTML=`<span style="color:var(--warn)">Select a paid plan first.</span>`; return; }
    out.innerHTML=`<span class="dim">⛓ Verifying ${asset==="btc"?"Bitcoin":"Ethereum (USDT)"} payment…</span>`;
    const billing = plan.unlimited ? "once" : period;
    const res=await billingPost("/api/billing/verify", {txid:tx, asset, plan:plan.id, billing});
    if(res.json && res.json.state==="pending"){
      const j=res.json;
      try{ localStorage.setItem(PEND_LS, JSON.stringify({txid:tx, plan:plan.id, asset, billing, note:j.note||""})); }catch(e){}
      out.innerHTML=`<span style="color:var(--warn)">⏳ Payment detected — awaiting confirmation. ${escapeHtml(j.note||"No license is issued until the payment confirms on-chain.")}</span>
        <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="primary" id="payrecheck">Re-check confirmation</button><span class="dim" style="font-size:11px">Payment stays pending until confirmed on-chain. Re-check any time — the signed license is issued automatically once confirmed.</span></div>`;
      const rk=document.getElementById("payrecheck");
      if(rk) rk.onclick=()=>document.getElementById("payverify").click();
      toast(`⏳ Payment detected — awaiting ${asset.toUpperCase()} confirmation`);
      return;
    }
    if(res.ok && res.json && res.json.ok){
      const j=res.json;
      try{ localStorage.removeItem(PEND_LS); }catch(e){}
      grant(plan.id, asset, tx, {billing, license:j.license, verified:"signed", paid:j.paid, confirmed:j.confirmed, note:j.note});
      out.innerHTML=`<span style="color:var(--ok)">✓ On-chain payment verified by the billing service — ${escapeHtml(j.paid)} ${asset.toUpperCase()} received${j.confirmed?"":" (provisional — pending confirmation)"}. <b>${plan.name}</b> unlocked${j.allowance!=null?` · ${j.allowance.toLocaleString()} tokens`:" · unlimited"} until ${j.expires_at? new Date(j.expires_at*1000).toLocaleDateString():"forever"}.</span>`;
      toast(`✓ ${plan.name} unlocked — signed license issued`);
      setTimeout(()=>render(),1100);
      return;
    }
    if(res.json && (res.json.error==="billing_error" || res.json.error==="verification_failed" || res.json.error==="bad_request")){
      const msg=res.json.message||"Verification failed";
      out.innerHTML=`<span style="color:var(--bad)">✗ ${escapeHtml(msg)}</span>
        <div class="dim" style="font-size:11px;margin-top:6px">${/already used/i.test(msg)?"This transaction hash was already used to issue a license. Use a new payment.":"If the transaction was just broadcast, wait ~30s for the network to index it and retry."}</div>`;
      return;
    }
    out.innerHTML=`<span class="dim">⚠ Billing service unreachable — trying local verification for this session only.</span>`;
    try{
      const r = asset==="btc" ? await verifyBtc(tx, pr.btc) : await verifyUsdt(tx, pr.usdt);
      grant(plan.id, asset, tx, {billing, verified:"client", paid:r.paid, confirmed:r.confirmed, note:r.note});
      out.innerHTML=`<span style="color:var(--warn)">⚠ ${escapeHtml(r.paid)} ${asset.toUpperCase()} received (local verification only — license not server-signed). ${escapeHtml(r.note)}. <b>${plan.name}</b> unlocked for this browser.</span>`;
      toast(`⚠ ${plan.name} unlocked (local verification)`);
      setTimeout(()=>render(),1100);
    }catch(e){
      out.innerHTML=`<span style="color:var(--bad)">✗ ${escapeHtml(e.message||String(e))}</span>
      <div class="dim" style="font-size:11px;margin-top:6px">If the transaction was just broadcast, wait ~30s for the network to index it and retry.</div>`;
    }
  };
  document.getElementById("bsRefresh").onclick=refreshStatus;
  const lc=document.getElementById("licclear");
  if(lc) lc.onclick=()=>{ localStorage.removeItem(LIC_LS); toast("License removed"); render(); };
  paintStatus();
}

/* ---------- paywall gate ---------- */
function viewLocked(root, routeId){
  const need=PREMIUM[routeId], r=routes.find(x=>x.id===routeId);
  root.innerHTML=`<div class="card big"><div class="card-b" style="text-align:center;padding:40px 20px">
    <div style="font-size:32px">🔒</div>
    <h3 style="margin:10px 0 4px;font-size:16px">${escapeHtml(r?.label||routeId)} is a ${PLANS.find(p=>p.id===need).name} capability</h3>
    <div class="dim" style="font-size:12px;max-width:520px;margin:0 auto 16px">Unlock it with an on-chain payment in BTC or USDT. Verification happens against public blockchain nodes — no account, no card, no subscription processor.</div>
    <button class="primary" id="gotoPricing">View crypto pricing</button>
  </div></div>`;
  document.getElementById("gotoPricing").onclick=()=>{ state.lockCtx={label:r?.label||routeId, need}; go("pricing"); };
}

routes.push({ id:"pricing", label:"Pricing", icon:"◇" });
VIEW_MAP.pricing = (v)=>{ const c=state.lockCtx; state.lockCtx=null; viewPricing(v,c); };

const _renderNavV6 = renderNav;
renderNav = function(){
  _renderNavV6();
  document.querySelectorAll("#nav .item").forEach(el=>{
    const id=el.dataset.r;
    if(PREMIUM[id] && !hasAccess(id)){
      el.style.opacity=".55";
      const lbl=el.querySelector(".lbl");
      if(lbl) lbl.innerHTML = lbl.textContent + ' <span style="font-size:10px">🔒</span>';
    }
    if(id==="pricing") el.querySelector("span:last-child")?.setAttribute("style","");
  });
};

const _renderV6 = render;
render = function(){
  if(state.route!=="pricing" && !hasAccess(state.route)){
    renderNav(); renderTop();
    const v=document.getElementById("view"); v.innerHTML="";
    viewLocked(v, state.route);
    return;
  }
  _renderV6();
};

/* premium action gates */
const _runAgentV6 = runAgent;
const FREE_AGENTS = ["architect","security","onboard"];
runAgent = function(a){
  if(!FREE_AGENTS.includes(a.id) && RANK[tier()] < RANK.pro){
    toast("🔒 "+a.name+" is a Pro agent — unlock with crypto");
    state.lockCtx={label:a.name+" agent", need:"pro"}; go("pricing"); return;
  }
  return _runAgentV6(a);
};

render();
</script>
</body>
